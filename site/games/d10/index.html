<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================ basics
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function errPush(m) { try { if (window.__errors.length < 60) window.__errors.push(String(m)); } catch (x) {} }
const col = hex => new THREE.Color(hex);

const QS = new URLSearchParams(location.search);
const AUTOTEST = QS.has('autotest');
const QFIX = ['low', 'mid', 'high'].includes(QS.get('q')) ? QS.get('q') : null;
const SPEED = AUTOTEST ? (parseFloat(QS.get('speed')) || 3) : 1;
const PRESET = {
  low:  { dpr: 1.0,  shadow: 0,    bloom: 0, waves: 2, parts: 200,  dens: .4,  water: [70, 180],  terr: [26, 190], detail: .6 },
  mid:  { dpr: 1.25, shadow: 1024, bloom: 1, waves: 3, parts: 500,  dens: .65, water: [110, 300], terr: [36, 280], detail: .85 },
  high: { dpr: 1.75, shadow: 2048, bloom: 2, waves: 4, parts: 1000, dens: 1,   water: [150, 420], terr: [48, 380], detail: 1 }
};
const QORDER = ['low', 'mid', 'high'];
let qName = QFIX || 'mid';
const Q0 = PRESET[qName];

// ============================================================ JS noise
function h3(x, y, z) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn3(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); let fx = x - X, fy = y - Y, fz = z - Z;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = lerp(lerp(h3(X, Y, Z), h3(X + 1, Y, Z), fx), lerp(h3(X, Y + 1, Z), h3(X + 1, Y + 1, Z), fx), fy);
  const b = lerp(lerp(h3(X, Y, Z + 1), h3(X + 1, Y, Z + 1), fx), lerp(h3(X, Y + 1, Z + 1), h3(X + 1, Y + 1, Z + 1), fx), fy);
  return lerp(a, b, fz);
}
const vn2 = (x, y) => vn3(x, y, 7.31);
function fbm2(x, y, o = 4) { let s = 0, a = .5; for (let i = 0; i < o; i++) { s += a * vn2(x, y); x = x * 2.03 + 3.1; y = y * 2.03 + 1.7; a *= .5; } return s / (1 - Math.pow(.5, o)); }

// ============================================================ river layout (s = distance along the river, world z = -s)
const cx = s => 7.0 * Math.sin(s * 0.02) + 3.0 * Math.sin(s * 0.008 + 1.0);
const cxd = s => 0.14 * Math.cos(s * 0.02) + 0.024 * Math.cos(s * 0.008 + 1.0);
const halfW = s => 6.8 + 2.4 * sstep(62, 92, s) + 25 * sstep(160, 200, s);
const bankL = s => halfW(s) * (1 + 0.12 * Math.sin(s * 0.05 + 1.3) + 0.07 * Math.sin(s * 0.13 + 0.4));
const bankR = s => halfW(s) * (1 + 0.11 * Math.sin(s * 0.043 + 4.1) + 0.08 * Math.sin(s * 0.11 + 2.2));
function bankE(x, s) { const lx = x - cx(s); return lx >= 0 ? lx - bankR(s) : -lx - bankL(s); }
const RIVER_GLSL = `
float cxf(float s){ return 7.0*sin(s*0.02) + 3.0*sin(s*0.008+1.0); }
float hwf(float s){ return 6.8 + 2.4*smoothstep(62.0,92.0,s) + 25.0*smoothstep(160.0,200.0,s); }
float bankEf(vec2 p){ float s = -p.y; float lx = p.x - cxf(s); float h = hwf(s);
  float bl = h*(1.0+0.12*sin(s*0.05+1.3)+0.07*sin(s*0.13+0.4));
  float br = h*(1.0+0.11*sin(s*0.043+4.1)+0.08*sin(s*0.11+2.2));
  return lx >= 0.0 ? lx - br : -lx - bl; }
`;
// gates & resting points
const STAGE = [{ d: 13, a: 4, v: 2.6 }, { d: 15, a: 6, v: 3.8 }, { d: 17, a: 8, v: 5.2 }];
const GATE_S = [], REST = [0];
{ let r = 0; for (let i = 0; i < 15; i++) { const st = STAGE[Math.floor(i / 5)]; const g = r + (i === 14 ? 22 : st.d); GATE_S.push(g); r = g + (i === 14 ? 10 : st.a); REST.push(r); } }
const U0 = REST[15];       // where the sky river begins
const pathDirAt = (s, out) => out.set(cxd(s), 0, -1).normalize();

// ============================================================ waves (shared with GLSL)
const WV = [[0.28, -0.96, 0.9, 0.035, 1.1], [-0.7, -0.71, 1.6, 0.02, 1.7], [0.95, 0.31, 2.7, 0.012, 2.3], [-0.2, 0.98, 4.3, 0.007, 3.1]];
let nWaves = Q0.waves;
function waveH(x, z, t) { let h = 0; for (let i = 0; i < nWaves; i++) { const w = WV[i]; h += w[3] * Math.sin((w[0] * x + w[1] * z) * w[2] + t * w[4]); } return h; }
function waveG(x, z, t, out) { let gx = 0, gz = 0; for (let i = 0; i < nWaves; i++) { const w = WV[i]; const c = w[3] * w[2] * Math.cos((w[0] * x + w[1] * z) * w[2] + t * w[4]); gx += c * w[0]; gz += c * w[1]; } out.x = gx; out.y = gz; return out; }
const WAVES_GLSL = `
const vec4 WA[4] = vec4[4](vec4(0.28,-0.96,0.9,0.035), vec4(-0.7,-0.71,1.6,0.02), vec4(0.95,0.31,2.7,0.012), vec4(-0.2,0.98,4.3,0.007));
const float WW[4] = float[4](1.1,1.7,2.3,3.1);
`;

// ============================================================ palette (sRGB hex -> linear colors)
const PAL = {
  zen: ['#253C79', '#344C91', '#505CA7', '#637BC1'],
  hor: ['#778AC4', '#9BA6DF', '#C1B3E8', '#F1D7EF'],
  wat: ['#326B9E', '#418EBB', '#69B5D7', '#B1E8F5'],
  moon: ['#DAEBFF', '#E3F1FF', '#F1F7FF', '#FFF7E5'],
  gate: ['#9FE7FF', '#B3D6FF', '#D3C5FF', '#FFF1CE']
};
for (const k in PAL) PAL[k] = PAL[k].map(h => col(h));

const FOG_BASE = col('#788EC3');

// ============================================================ renderer / scene
const canvas = document.createElement('canvas');
document.body.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: Q0.bloom === 0, powerPreference: 'high-performance', alpha: false, stencil: false });
} catch (e) { errPush('webgl: ' + e.message); throw e; }

const scene = new THREE.Scene();
scene.background = col('#253C79');
scene.fog = new THREE.FogExp2(0x788EC3, 0.0095);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 3000);
camera.position.set(0, 3, 10);
const tmpCam = camera.clone();

// lights
const hemi = new THREE.HemisphereLight(col('#BDD8FF'), col('#697A92'), 1.45);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(col('#E3EDFF'), 2.6);
moonLight.castShadow = Q0.shadow > 0;
moonLight.shadow.mapSize.set(Math.max(512, Q0.shadow), Math.max(512, Q0.shadow));

scene.add(moonLight); scene.add(moonLight.target);

scene.add(fillLight); scene.add(fillLight.target);
const crownLight = new THREE.PointLight(col('#FFF1E2'), 2.2, 7, 2);
scene.add(crownLight);
const gateLights = [new THREE.PointLight(col('#9FE7FF'), 0, 26, 1.6), new THREE.PointLight(col('#9FE7FF'), 0, 26, 1.6)];

// ============================================================ procedural textures
function canvasTex(w, h, fn, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); fn(g, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; return t;
}
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,.55)');
  gr.addColorStop(0.45, 'rgba(255,255,255,.14)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
// moon disc: maria + craters drawn in disc space
const moonTex = canvasTex(512, 512, (g, W) => {
  const img = g.createImageData(W, W); const d = img.data; const R = W / 2;
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const px = (x - R) / R, py = (y - R) / R; const r2 = px * px + py * py; const i = (y * W + x) * 4;
    if (r2 > 1) { d[i] = d[i + 1] = d[i + 2] = 200; d[i + 3] = 255; continue; }
    const pz = Math.sqrt(1 - r2);
    const m = fbm2(px * 2.2 + 4, py * 2.2 + 9, 5); const mar = sstep(0.52, 0.66, m) * 0.36;
    const fine = fbm2(px * 14, py * 14, 3) * 0.12;
    let v = 0.86 - mar + fine - 0.06 + (vn2(px * 40, py * 40) - .5) * 0.05;
    v *= 0.97 + 0.03 * pz;
    d[i] = clamp(v * 255, 0, 255); d[i + 1] = clamp(v * 252, 0, 255); d[i + 2] = clamp(v * 248, 0, 255); d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const r = rng(77);
  for (let k = 0; k < 150; k++) {
    const a = r() * TAU, rr = Math.sqrt(r()) * 0.96; const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    const size = (r() < 0.12 ? 0.05 + r() * 0.06 : 0.008 + r() * 0.03) * R; const fore = Math.sqrt(Math.max(0.05, 1 - rr * rr));
    g.save(); g.translate(R + px * R, R + py * R); g.rotate(a); g.scale(fore, 1);
    const gr = g.createRadialGradient(-size * 0.15, 0, 0, 0, 0, size);
    gr.addColorStop(0, 'rgba(70,70,80,.30)'); gr.addColorStop(0.7, 'rgba(90,90,100,.18)'); gr.addColorStop(0.86, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, size, 0, TAU); g.fill(); g.restore();
  }
  // a rayed crater
  g.save(); g.translate(R * 0.82, R * 1.42); for (let k = 0; k < 26; k++) { g.rotate(TAU / 26 + r() * 0.1); g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(0, -1.5, R * (0.2 + r() * 0.35), 3); } g.restore();
});
// boat wood: planks along the hull with grain
const woodTex = canvasTex(256, 512, (g, W, H) => {
  const img = g.createImageData(W, H); const d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = y / H, u = x / W; const plank = Math.floor(v * 8); const pv = v * 8 - plank;
    const grain = Math.sin((u * 40 + fbm2(u * 6 + plank * 3.1, v * 30, 3) * 6) * 3.0) * 0.5 + 0.5;
    let c = 0.75 + 0.18 * grain + (h3(plank, 3, 1) - .5) * 0.18;
    if (pv < 0.04 || pv > 0.96) c *= 0.45;
    const i = (y * W + x) * 4; d[i] = clamp(c * 150, 0, 255); d[i + 1] = clamp(c * 100, 0, 255); d[i + 2] = clamp(c * 64, 0, 255); d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

// ============================================================ shared GLSL
const NOISE_GLSL = `
float h31(vec3 p){ p = fract(p*0.3183099+vec3(.1,.2,.3)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn3(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fb3(vec3 p){ float a=.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vn3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vn2(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h12(i),h12(i+vec2(1,0)),f.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x),f.y); }
`;

// global uniforms shared by many materials
const G = {
  uTime: { value: 0 },
  uMoonDir: { value: new V3(0, 0.15, -1).normalize() },
  uMoonCol: { value: new THREE.Color() },
  uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
  uFogCol: { value: new THREE.Color() }, uFogD: { value: 0.0095 },
  uLV: { value: new V3() }, uLC: { value: new THREE.Color() },
  uFlLit: { value: -50 }, uFlGlow: { value: 0 }, uFlCol: { value: new THREE.Color('#cfe8ff') }
};

// ============================================================ material patches
function patchPetal(U) {
  return function (sh) {
    sh.uniforms.uLV = G.uLV; sh.uniforms.uLC = G.uLC; sh.uniforms.uIri = U.uIri; sh.uniforms.uTrans = U.uTrans;
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uLV; uniform vec3 uLC; uniform float uIri; uniform float uTrans;')
      .replace('#include <opaque_fragment>', `
      { vec3 Nn = normalize(normal); vec3 Vv = normalize(vViewPosition);
        float back = max(-dot(Nn, uLV), 0.0);
        float fwd = pow(max(dot(-Vv, uLV), 0.0), 3.0);
        outgoingLight += diffuseColor.rgb * uLC * (back*0.5 + fwd*0.42 + 0.06) * uTrans;
        float ndv = abs(dot(Nn, Vv));
        outgoingLight += diffuseColor.rgb * uLC * pow(1.0-ndv, 3.0) * 0.25;
        vec3 rb = 0.55 + 0.45*cos(6.2832*(vec3(0.0,0.33,0.67) + ndv*1.3 + vViewPosition.x*0.9 + vViewPosition.y*0.6));

}
function patchStone(U) {
  return function (sh) {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aArc; varying float vArc; varying vec3 vWS;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvArc = aArc; vWS = (modelMatrix*vec4(position,1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uRun,uLit,uBreath,uRim,uMoss,uBump; uniform vec3 uGlow,uRimC; varying float vArc; varying vec3 vWS;\n' + NOISE_GLSL)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float nA = fb3(vWS*1.25); float nB = vn3(vWS*5.0);
        diffuseColor.rgb *= 0.72 + 0.52*nA + 0.12*nB;
        diffuseColor.rgb *= mix(vec3(1.0), vec3(0.86,0.93,1.08), smoothstep(0.35,0.7,vn3(vWS*0.45+3.0)));
        float wet = 1.0 - smoothstep(-0.2, 0.9, vWS.y);
        float moss = smoothstep(0.55, 0.69, fb3(vWS*0.7+11.0)) * uMoss * (0.3 + 0.7*wet + 0.5*smoothstep(0.62,0.8,vn3(vWS*1.7)));
        moss = clamp(moss, 0.0, 1.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.11,0.19,0.08), moss*0.85);
        diffuseColor.rgb *= 1.0 - wet*0.45;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.32, wet*(1.0-moss));`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        { vec3 pp = vWS*3.2; float e = 0.05; float b0 = vn3(pp);
          vec3 gr = vec3(vn3(pp+vec3(e,0.0,0.0))-b0, vn3(pp+vec3(0.0,e,0.0))-b0, vn3(pp+vec3(0.0,0.0,e))-b0)/e;
          vec3 gv = (viewMatrix*vec4(gr,0.0)).xyz; normal = normalize(normal - (gv - dot(gv,normal)*normal)*0.07*uBump); }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float vein = 1.0 - smoothstep(0.0, 0.05, abs(fb3(vWS*0.6+5.0)-0.47));
        float fr = smoothstep(uRun-0.22, uRun, vArc)*(1.0-smoothstep(uRun, uRun+0.04, vArc));
        float litA = uLit*(0.16+0.84*vein)*(0.45+0.55*vArc);
        totalEmissiveRadiance += uGlow*(fr*(0.7+1.8*vein)*2.0 + litA*1.7 + vein*uBreath*0.22);

}
function patchCrystal(U) {
  return function (sh) {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aArc; varying float vArc;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvArc = aArc;');

    game.spin += (game.v * 0.05 * Math.sign(game.spinV || 1) + game.spinV * 0.25) * dt;
    crownInner.rotation.set(clamp(-_g2.y * 1.5 + 0.03 * Math.sin(t * 1.3), -0.052, 0.052), game.spin, clamp(_g2.x * 1.5 + 0.03 * Math.sin(t * 1.1 + 1), -0.052, 0.052));
    if (sky) { const pitch = Math.asin(clamp(dir.y, -1, 1)); crown.rotation.set(0, Math.atan2(-dir.x, -dir.z), 0); crownInner.rotation.x += pitch * 0.8; } else crown.rotation.set(0, 0, 0);
    crownLight.position.set(crown.position.x, crown.position.y + 1.4, crown.position.z + 0.6);
    crownLight.intensity = 2.2 + (st === ST.CLIMAX || st === ST.AFTERGLOW ? 2 : 0);
    // halo / hint orb
    crownHalo.material.opacity = damp(crownHalo.material.opacity, (game.orbit ? 0.25 : 0.06) + (st === ST.CLIMAX || st === ST.AFTERGLOW ? 0.45 : 0) + game.dip * 0.3, 0.3, dt);
    const ot = t * 2.2; hintOrb.position.set(Math.cos(ot) * CR, 0.12, Math.sin(ot) * CR);
    hintOrb.material.opacity = damp(hintOrb.material.opacity, game.orbit ? 0.95 : 0, 0.25, dt);
    if (game.orbit && Math.random() < dt * 24) { tmpV3.copy(hintOrb.position).applyMatrix4(crown.matrixWorld); parts.spawn(tmpV3.x, tmpV3.y, tmpV3.z, 0, 0.12, 0, 0.8, PC.moon, 0.09, 0, 1); }
    // wake uniform
    const wv = clamp(game.v / 3, 0, 1.4) * (sky ? 0 : 1);
    waterU.uCrown.value.set(crown.position.x, crown.position.z, dir.x / Math.hypot(dir.x, dir.z), dir.z / Math.hypot(dir.x, dir.z));
    waterU.uCrownV.value = damp(waterU.uCrownV.value, wv, 0.4, dt);
    waterU.uWakeL.value = 8 + 8 * clamp(game.lit / 10, 0, 1.5);
  }

  // ---- camera rig
  const inSky = st === ST.CLIMAX || st === ST.AFTERGLOW || (st === ST.RESET && game.resetPhase === 0);
  if (!inSky) {
    const allow = st === ST.AIM || st === ST.IDLE || st === ST.ADVANCE || st === ST.STAGE_TRANSITION || st === ST.DRAG;
    if (allow || st === ST.ACTIVATE) frameFeedback(dt, allow);
  } else rig.B = damp(rig.B, 7.8, 2.5, dt);
  computeRigTarget(rig.B, rig.w, rig.tPos, rig.tLook);
  const tauP = inSky ? 0.7 : 0.85, tauL = inSky ? 0.6 : 0.55;
  rig.pos.x = damp(rig.pos.x, rig.tPos.x, tauP, dt); rig.pos.y = damp(rig.pos.y, rig.tPos.y, tauP, dt); rig.pos.z = damp(rig.pos.z, rig.tPos.z, tauP, dt);
  rig.look.x = damp(rig.look.x, rig.tLook.x, tauL, dt); rig.look.y = damp(rig.look.y, rig.tLook.y, tauL, dt); rig.look.z = damp(rig.look.z, rig.tLook.z, tauL, dt);
  camera.position.copy(rig.pos); camera.up.set(0, 1, 0); camera.lookAt(rig.look); camera.updateMatrixWorld();

  // ---- boat follows under the camera
  {
    const camS = game.s - rig.B; const bs = camS + rig.boatOff;
    const bp = pathPos(Math.max(-30, bs), tmpV); const bd = pathTan(Math.max(-30, bs), tmpV2);
    const sky = bs > U0 + 0.5;
    const by = sky ? bp.y + 0.05 : waveH(bp.x, bp.z, t) * 0.8 - 0.02;
    boat.position.set(bp.x, by + 0.01 * Math.sin(t * 1.4), bp.z);
    boat.rotation.set(Math.asin(clamp(bd.y, -1, 1)) + 0.012 * Math.sin(t * 1.1), Math.atan2(-bd.x, -bd.z), 0.015 * Math.sin(t * 0.9), 'YXZ');
    // keep the bow near 90% from top
    const bow = tmpV3.set(0, 0.5, boat.userData.bowZ).applyMatrix4(boat.matrixWorld); const by2 = -proj(bow, camera).y * 0.5 + 0.5;
    if (inSky) rig.boatOff = damp(rig.boatOff, 2.4, 1.0, dt);
    if (!inSky) { if (by2 > 0.94) rig.boatOff += 1.5 * dt; else if (by2 < 0.86) rig.boatOff -= 1.5 * dt; rig.boatOff = clamp(rig.boatOff, 1.5, Math.max(7, rig.B * 0.6)); }
    boat.updateMatrixWorld();
  }

  // ---- moon placement (camera relative, always centered)
  {
    const tgtY = inSky ? lerp(0.6, 0.38, rig.climaxK) : 0.6;
    rig.moonY = damp(rig.moonY, tgtY, 1.2, dt);
    let deg = 6 + 4.2 * clamp(game.lit / 15, 0, 1);
    if (inSky) deg = lerp(10.2, 17, sstep(6, 22, game.climaxT));
    rig.moonDeg = damp(rig.moonDeg, deg, 1.0, dt);
    // keep the disc inside the safe area
    const maxR = (1 - rig.moonY) - 0.2; // ndc units from center to top margin
    const halfFov = camera.fov * DEG / 2; let rr = Math.tan(rig.moonDeg * DEG / 2) / Math.tan(halfFov);
    if (rr > maxR) rr = maxR; const ang = 2 * Math.atan(rr * Math.tan(halfFov));
    const dirv = moonTmp.set(0, rig.moonY, 0.5).unproject(camera).sub(camera.position).normalize();
    G.uMoonDir.value.copy(dirv);
    const D = 900; moon.position.copy(camera.position).addScaledVector(dirv, D); moon.quaternion.copy(camera.quaternion);
    const size = 2 * D * Math.tan(ang / 2); moon.scale.set(size, size, 1);
    moonMat.uniforms.uI.value = lerp(1.12, 1.5, clamp(game.prog / 3, 0, 1));
    moonHalo.position.copy(moon.position).addScaledVector(dirv, 5); moonHalo.scale.setScalar(size * 3.2); moonHalo.material.opacity = 0.22 + 0.2 * clamp(game.prog / 3, 0, 1);
    moonHalo2.position.copy(moon.position).addScaledVector(dirv, 8); moonHalo2.scale.setScalar(size * 8); moonHalo2.material.opacity = 0.07 + 0.12 * clamp(game.prog / 3, 0, 1);
    moonHalo.material.color.copy(G.uMoonCol.value); moonHalo2.material.color.copy(G.uHor.value);
  }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  starMat.uniforms.uStar.value = 1 - 0.3 * clamp(game.prog - 2, 0, 1);

  // ---- lights follow the action
  {
    const f = tmpV.set(G.uMoonDir.value.x, 0, G.uMoonDir.value.z).normalize();
    const L = tmpV2.copy(f).multiplyScalar(0.72).add(tmpV3.set(0, 0.62, 0)).add(tmpV4.set(-f.z * 0.3, 0, f.x * 0.3)).normalize();
    const c = crown.position;
    moonLight.target.position.copy(c).addScaledVector(f, -2); moonLight.position.copy(moonLight.target.position).addScaledVector(L, 70);
    moonLight.intensity = lerp(2.4, 3.2, clamp(game.prog / 3, 0, 1));
    fillLight.position.copy(camera.position).add(tmpV3.set(0, 6, 0)); fillLight.target.position.copy(c);
    G.uLV.value.copy(L).transformDirection(camera.matrixWorldInverse);
    hemi.intensity = lerp(1.2, 1.45, clamp(game.prog / 3, 0, 1));
  }
  parts.update(dt);
  updateCrownScreen();
}

// ============================================================ test hook (read only, never drawn)
const _q = new V3();
function scr(p) { const v = proj(_q.copy(p), camera); return { x: +(v.x * 0.5 + 0.5).toFixed(4), y: +(-v.y * 0.5 + 0.5).toFixed(4) }; }
window.__d10 = {
  get state() { return game.state; }, get lit() { return game.lit; }, get stage() { return Math.min(3, Math.floor(game.lit / 5)); }, get q() { return qName; }, get fps() { return +qa.fps.toFixed(1); },
  get cycle() { return game.cycle; }, get visited() { return [...game.visited]; }, get climaxReached() { return game.climaxReached; }, get climaxCount() { return game.climaxCount || 0; }, get arrivedCount() { return game.arrivedCount || 0; }, get arrived() { return game.arrived; },
  get climaxT() { return +game.climaxT.toFixed(2); }, replayStarted: false,
  frame() {
    const g = gateFor(); const C = crownWorld(new V3());
    const mc = scr(moon.position); const mr = moon.scale.x / 2; const edge = scr(moon.position.clone().add(new V3(0, mr, 0).applyQuaternion(camera.quaternion)));
    const out = { crown: scr(crown.position), moon: mc, moonTop: edge.y, moonR: +(Math.abs(mc.y - edge.y)).toFixed(4), B: +rig.B.toFixed(2) };
    if (g) { out.gate = scr(g.center); out.apex = scr(g.apex); out.gL = scr(g.sideL); out.gR = scr(g.sideR); }
    const bow = new V3(0, 0.5, boat.userData.bowZ).applyMatrix4(boat.matrixWorld); out.bow = scr(bow);
    return out;
  }
};

// ============================================================ loop
let frames = 0, errCount = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { clockT.last = now; return; }
  let rdt = (now - clockT.last) / 1000; clockT.last = now;
  if (!(rdt > 0)) rdt = 0.016;
  if (rdt > 0.25) rdt = 0.016; // returning from background: no time jump
  const dt = Math.min(rdt, 0.1) * SPEED;
  try {
    update(Math.min(dt, 0.25), rdt);
    if (composer && PRESET[qName].bloom > 0) composer.render(); else renderer.render(scene, camera);
    frames++;
    if (frames === 3) { window.__ready = true; const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 900); } }
    qualityTick(rdt);
  } catch (e) { if (errCount++ < 3) errPush('frame: ' + (e && e.stack || e)); }
}
document.addEventListener('visibilitychange', () => {
  clockT.last = performance.now();
  if (AU.ctx) { if (document.hidden) AU.ctx.suspend().catch(() => {}); else AU.ctx.resume().catch(() => {}); }
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); paused = true; }, false);
canvas.addEventListener('webglcontextrestored', () => { paused = false; clockT.last = performance.now(); envStage = -1; }, false);

// ============================================================ start
try {
  applyQuality(qName, true);
  resize();
  applyPalette(0);
  refreshEnv(0);
  game.target = REST[1];
  ready = true;
  const SK = parseInt(QS.get('dbgskip')); // debug only: start with N gates already awake
  if (SK > 0) { for (let i = 0; i < Math.min(14, SK); i++) { gates[i].actT = -10; gates[i].lit = 1; gates[i].U.uRun.value = 1.3; gates[i].U.uLit.value = 1; } game.lit = Math.min(14, SK); game.nextGate = game.lit; game.s = REST[game.lit]; game.target = REST[game.lit + 1]; game.prog = game.lit / 5 * 0.9; setState(ST.AIM); }
  settleRig(220);
  renderer.compile(scene, camera);
  requestAnimationFrame(t => { clockT.last = t; requestAnimationFrame(frame); });
} catch (e) { errPush('init: ' + (e && e.stack || e)); }
</script>
