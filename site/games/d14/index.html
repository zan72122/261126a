<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------
// basics
// ---------------------------------------------------------------------------
const QS = new URLSearchParams(location.search);
const AUTOTEST = QS.has('autotest');
const QFIX = ['low', 'mid', 'high'].includes(QS.get('q')) ? QS.get('q') : null;
const SPEED = AUTOTEST ? (parseFloat(QS.get('speed')) || 2.5) : 1;
const DBG = QS.has('dbg');

let rs = (parseInt(QS.get('seed'), 10) || 140714) >>> 0;
function rnd() { rs = (Math.imul(rs, 1664525) + 1013904223) >>> 0; return rs / 4294967296; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const s5 = (t) => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const DEG = Math.PI / 180;

const QUAL = {
  low:  { pr: 1.0,  rings: 64,  segs: 96,  shadow: 0,    clouds: 35,  parts: 120, birds: 3, bloom: 0,   rays: 1, bgPer: 2 },
  mid:  { pr: 1.25, rings: 96,  segs: 128, shadow: 1024, clouds: 70,  parts: 300, birds: 5, bloom: 0.5, rays: 2, bgPer: 3 },
  high: { pr: 1.75, rings: 160, segs: 192, shadow: 2048, clouds: 120, parts: 600, birds: 8, bloom: 1,   rays: 4, bgPer: 4 },
};
const QORDER = ['low', 'mid', 'high'];

// value noise (tileable when per > 0)
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, per) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const p = per > 0 ? per : 1 << 30;
  const x0 = ((xi % p) + p) % p, x1 = (((xi + 1) % p) + p) % p, y0 = ((yi % p) + p) % p, y1 = (((yi + 1) % p) + p) % p;
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct, per) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, per ? per * f : 0); n += a; a *= 0.5; f *= 2; }
  return s / n;
}

// ---------------------------------------------------------------------------
// renderer / scene
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1200);
scene.add(camera);
const fitCam = new THREE.PerspectiveCamera(50, 1, 0.1, 1200);

const SEA_R = 420, SEA_R0 = 110, DROP_MAX = 45;
// the raised sea shrinks into a floating lens as it climbs, so its rim and the clouds below it come into view
const SEA = { R: SEA_R, R0: SEA_R0, drop: 0, k: 0, edgeY: 0 };
function seaShape(lift) {
  const u = Math.max(0, Math.min(1, (lift - 20) / 75)), sm = u * u * (3 - 2 * u);
  SEA.R = SEA_R * (1 - 0.42 * sm); SEA.R0 = SEA.R * (0.26 - 0.06 * sm);
  SEA.drop = Math.min(lift, DROP_MAX + 25 * sm);
  SEA.k = SEA.drop / ((SEA.R - SEA.R0) ** 2); SEA.edgeY = lift - SEA.drop;
}

// ---------------------------------------------------------------------------
// palettes (four stages)
// ---------------------------------------------------------------------------
const PAL_SRC = [
  { zen: '#529FD5', hor: '#FFE3AD', sea: '#237FA5', refl: '#FFDB89', cl: '#FFF0DE', cs: '#91B1CB', sun: '#FFD0A0', dI: 2.3, hI: 1.1, fog: '#C9DCE6', fn: 140, ff: 950 },
  { zen: '#429FE5', hor: '#FFF0C9', sea: '#168FB7', refl: '#FFE5A2', cl: '#FFF5EA', cs: '#9BBFD8', sun: '#FFE0BD', dI: 2.6, hI: 1.3, fog: '#C7DEEA', fn: 150, ff: 960 },
  { zen: '#409CEB', hor: '#FFF1DA', sea: '#28B5CF', refl: '#FFF0C2', cl: '#FFF8F2', cs: '#AAC8DE', sun: '#FFEBCF', dI: 2.9, hI: 1.5, fog: '#C5DFEC', fn: 165, ff: 980 },
  { zen: '#328FE3', hor: '#FFF4D7', sea: '#53CEDD', refl: '#FFF6D8', cl: '#FFFBF2', cs: '#BDD8EB', sun: '#FFF4DE', dI: 3.2, hI: 1.7, fog: '#C8E2EE', fn: 180, ff: 1000 },
];
const PAL = PAL_SRC.map(p => {
  const o = {};
  for (const k in p) o[k] = typeof p[k] === 'string' ? new THREE.Color(p[k]) : p[k];
  o.fog = o.fog.clone().lerp(o.hor, 0.22);
  return o;
});

// shared uniforms
const U = {
  uTime: { value: 0 },
  uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
  uSunCol: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 0.2, -1).normalize() },
  uFogCol: { value: new THREE.Color() }, uFogNear: { value: 140 }, uFogFar: { value: 950 },
  uSunBoost: { value: 0 }, uSunI: { value: 1 },
  uSea: { value: new THREE.Color() }, uRefl: { value: new THREE.Color() },
  uCL: { value: new THREE.Color() }, uCS: { value: new THREE.Color() },
  uSeaY: { value: 0 },
};

const SKY_GLSL = `
uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSunCol; uniform vec3 uSunDir; uniform vec3 uFogCol;
uniform float uSunBoost; uniform float uFogNear; uniform float uFogFar;
vec3 skyCol(vec3 d){
  float y = d.y;
  float h = clamp(y, 0.0, 1.0);
  vec3 c = mix(uHor, uZen, pow(smoothstep(0.0, 0.22, h), 0.5));
  float sd = max(dot(d, uSunDir), 0.0);
  c = mix(c, uHor * 1.03, pow(sd, 9.0) * 0.4 * (1.0 - h));
  c += uSunCol * (pow(sd, 10.0) * 0.18 + pow(sd, 70.0) * 0.55 + pow(sd, 600.0) * 1.6) * (1.0 + uSunBoost);
  c = mix(c, uFogCol, smoothstep(0.0, -0.1, y));
  return c;
}
float fogF(float d){ return clamp((d - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
`;
const OUT_GLSL = `
gl_FragColor.rgb = min(gl_FragColor.rgb, vec3(3.2));
#include <tonemapping_fragment>
#include <colorspace_fragment>
`;

// ---------------------------------------------------------------------------
// procedural textures
// ---------------------------------------------------------------------------
function makeWaterTex(S) {
  const h = new Float32Array(S * S), f = new Float32Array(S * S);
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const x = i / S, y = j / S;
    let v = fbm(x * 8, y * 8, 4, 8) * 1.2;
    v += 0.22 * Math.sin(2 * Math.PI * (3 * x + 5 * y)) + 0.17 * Math.sin(2 * Math.PI * (7 * x - 2 * y) + 1.3)
       + 0.12 * Math.sin(2 * Math.PI * (-4 * x + 9 * y) + 2.1) + 0.08 * Math.sin(2 * Math.PI * (11 * x + 6 * y) + 0.4);
    h[j * S + i] = v;
    f[j * S + i] = fbm(x * 4 + 3.1, y * 4 + 7.7, 5, 4);
  }
  let mx = 0; const dx = new Float32Array(S * S), dz = new Float32Array(S * S);
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const a = h[j * S + ((i + 1) % S)] - h[j * S + ((i - 1 + S) % S)];
    const b = h[((j + 1) % S) * S + i] - h[((j - 1 + S) % S) * S + i];
    dx[j * S + i] = a; dz[j * S + i] = b; mx = Math.max(mx, Math.abs(a), Math.abs(b));
  }
  let fmin = 1, fmax = 0; for (let k = 0; k < S * S; k++) { fmin = Math.min(fmin, f[k]); fmax = Math.max(fmax, f[k]); }
  const data = new Uint8Array(S * S * 4);
  for (let k = 0; k < S * S; k++) {
    data[k * 4] = clamp(128 + dx[k] / mx * 120, 0, 255);
    data[k * 4 + 1] = clamp(128 + dz[k] / mx * 120, 0, 255);
    data[k * 4 + 2] = clamp((f[k] - fmin) / (fmax - fmin) * 255, 0, 255);
    data[k * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.anisotropy = 4; t.needsUpdate = true;
  return t;
}

function makeCloudAtlas(S) {
  const W = S * 2, data = new Uint8Array(W * W * 4);
  const dens = new Float32Array(S * S), nz = new Float32Array(S * S);
  const step = Math.max(1, Math.round(S / 40));
  for (let v = 0; v < 4; v++) {
    const blobs = []; const nb = 4 + Math.floor(rnd() * 3);
    for (let i = 0; i < nb; i++) {
      const t = (i + 0.5) / nb, arch = Math.sin(t * Math.PI);
      blobs.push({ x: 0.2 + 0.6 * t + (rnd() - 0.5) * 0.08, y: 0.38 + arch * 0.14 + rnd() * 0.06, r: 0.12 + rnd() * 0.07 + arch * 0.1 });
    }
    const ox = rnd() * 50, oy = rnd() * 50;
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const x = i / S, y = j / S;
      let sh = 0;
      for (const b of blobs) { const dx = (x - b.x) / b.r, dy = (y - b.y) / (b.r * (y < b.y ? 0.7 : 1.0)); sh = Math.max(sh, 1 - (dx * dx + dy * dy)); }
      sh *= sstep(0.2, 0.34, y);
      const n = fbm(x * 5 + ox, y * 5 + oy, 5, 0);
      let d = sh * 1.35 + (n - 0.5) * 1.15 - 0.22;
      const ex = Math.min(x, 1 - x, y, 1 - y);
      d = clamp(d, 0, 1) * sstep(0, 0.1, ex);
      dens[j * S + i] = d; nz[j * S + i] = n;
    }
    const ox2 = (v % 2) * S, oy2 = Math.floor(v / 2) * S;
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      let acc = 0;
      for (let k = 1; k <= 7; k++) { const jj = j + k * step; if (jj >= S) break; acc += dens[jj * S + Math.min(S - 1, i + (k * step >> 1))]; }
      const lit = Math.exp(-acc * 0.5);
      const o = ((oy2 + j) * W + ox2 + i) * 4;
      data[o] = dens[j * S + i] * 255; data[o + 1] = lit * 255; data[o + 2] = nz[j * S + i] * 255; data[o + 3] = 255;
    }
  }
  const t = new THREE.DataTexture(data, W, W, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}

function canvasTex(S, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); draw(g, S);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
const woodTex = canvasTex(256, (g, S) => {
  const im = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const plank = Math.floor(x / 32);
    const grain = fbm(x * 0.06 + plank * 7.3, y * 0.006 + plank * 2.1, 4, 0);
    const ring = 0.5 + 0.5 * Math.sin(grain * 38 + x * 0.05);
    let k = 0.86 + ring * 0.1 + (hash2(plank, 3) - 0.5) * 0.12;
    if (x % 32 < 1 || (y + plank * 97) % 256 < 1) k *= 0.62;
    const o = (y * S + x) * 4;
    im.data[o] = clamp(185 * k, 0, 255); im.data[o + 1] = clamp(138 * k, 0, 255); im.data[o + 2] = clamp(89 * k, 0, 255); im.data[o + 3] = 255;
  }
  g.putImageData(im, 0, 0);
});
const sailTex = canvasTex(256, (g, S) => {
  const im = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const weave = ((x & 1) ^ (y & 1)) ? 0.985 : 1.0;
    let k = weave * (0.96 + fbm(x * 0.05, y * 0.05, 3, 0) * 0.05);
    if (y % 42 < 2) k *= 0.93;
    const o = (y * S + x) * 4;
    im.data[o] = clamp(255 * k, 0, 255); im.data[o + 1] = clamp(249 * k, 0, 255); im.data[o + 2] = clamp(237 * k, 0, 255); im.data[o + 3] = 255;
  }
  g.putImageData(im, 0, 0);
});

const T_START = performance.now();
const waterTex = makeWaterTex(256);
const cloudTex = makeCloudAtlas(160);

// ---------------------------------------------------------------------------
// sky dome + environment
// ---------------------------------------------------------------------------
const skyMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize((modelMatrix * vec4(position,1.0)).xyz - cameraPosition); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position.z = gl_Position.w * 0.99999; }`,
  fragmentShader: SKY_GLSL + `varying vec3 vD;
  void main(){ vec3 d = normalize(vD); vec3 c = skyCol(d);
    float sd = dot(d, uSunDir);
    c += uSunCol * 26.0 * smoothstep(0.99988, 0.99993, sd) * (1.0 + uSunBoost * 0.3);
    gl_FragColor = vec4(c, 1.0);` + OUT_GLSL + `}`,
  side: THREE.BackSide, depthWrite: false, depthTest: true,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const envScene = new THREE.Scene();
const envMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: SKY_GLSL + `varying vec3 vD; void main(){ vec3 d = normalize(vD); vec3 c = skyCol(d); if (d.y < 0.0) c = mix(c, uFogCol * 0.6, smoothstep(0.0,-0.3,d.y)); gl_FragColor = vec4(c,1.0); }`,
  side: THREE.BackSide, depthWrite: false,
});
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), envMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function rebuildEnv() {
  const old = envRT;
  envRT = pmrem.fromScene(envScene, 0, 0.1, 100);
  scene.environment = envRT.texture;
  if (old) old.dispose();
}

// ---------------------------------------------------------------------------
// water (raised sea disk) + lower ocean
// ---------------------------------------------------------------------------
const WAVES = [
  { L: 24, A: 0.28, dir: 18, Q: 1.0, f0: 170, f1: 420 },
  { L: 19, A: 0.19, dir: -38, Q: 0.9, f0: 150, f1: 380 },
  { L: 7.5, A: 0.12, dir: 52, Q: 0.8, f0: 55, f1: 160 },
  { L: 5.5, A: 0.09, dir: -12, Q: 0.8, f0: 45, f1: 140 },
  { L: 1.8, A: 0.045, dir: 80, Q: 0.6, f0: 14, f1: 40 },
  { L: 1.1, A: 0.025, dir: -64, Q: 0.5, f0: 9, f1: 28 },
].map(w => { const k = 2 * Math.PI / w.L, a = w.dir * DEG; return { ...w, k, w: Math.sqrt(9.81 * k), dx: Math.sin(a), dz: -Math.cos(a) }; });

function waveHeight(x, z, t) {
  let y = 0, gx = 0, gz = 0;
  for (let i = 0; i < 4; i++) {
    const w = WAVES[i], f = w.k * (w.dx * x + w.dz * z) - w.w * t;
    y += w.A * Math.sin(f);
    const c = w.A * w.k * Math.cos(f); gx += c * w.dx; gz += c * w.dz;
  }
  return { y, gx, gz };
}

const waterU = {
  ...U,
  uNrm: { value: waterTex },
  uWD: { value: WAVES.map(w => new THREE.Vector4(w.dx, w.dz, w.k, w.A)) },
  uWS: { value: WAVES.map(w => new THREE.Vector4(w.Q, w.w, w.f0, w.f1)) },
  uCenter: { value: new THREE.Vector2() },
  uBend: { value: 0 }, uR0: { value: SEA_R0 }, uAmp: { value: 1 }, uScale: { value: 1 },
  uGlit: { value: 1 }, uChop: { value: 0.6 },
  uSh: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, 0, 1, 0)) },
  uPatch: { value: [new THREE.Vector4(0, 0, 5, 0), new THREE.Vector4(0, 0, 3, 0)] },
  uPatchLen: { value: [0, 0] },
  uShip: { value: new THREE.Vector4(0, 0, 0, 1) },
  uPath: { value: 0 }, uPathW: { value: 6 }, uFront: { value: 0 }, uFrontI: { value: 0 },
  uEdgeR: { value: SEA_R }, uEdgeFoam: { value: 0 },
};

const WATER_VS = `
uniform float uTime; uniform float uSeaY; uniform float uBend; uniform float uR0; uniform float uAmp; uniform float uScale;
uniform vec2 uCenter; uniform vec4 uWD[6]; uniform vec4 uWS[6];
varying vec3 vW; varying vec3 vGN; varying float vR;
void main(){
  vec2 lp = position.xz * uScale;
  float r = length(lp);
  vec2 p = lp + uCenter;
#ifdef LOWER
  vec3 w = vec3(p.x, uSeaY, p.y);
  vGN = vec3(0.0, 1.0, 0.0);
#else
  float dc = distance(p, cameraPosition.xz);
  vec3 d = vec3(0.0); vec3 n = vec3(0.0, 1.0, 0.0);
  for (int i = 0; i < 6; i++) {
    vec4 a = uWD[i]; vec4 b = uWS[i];
    float A = a.w * uAmp * (1.0 - smoothstep(b.z, b.w, dc));
    float f = a.z * dot(a.xy, p) - b.y * uTime;
    float c = cos(f), s = sin(f);
    d.x += b.x * A * a.x * c; d.z += b.x * A * a.y * c; d.y += A * s;
    n.x -= a.x * a.z * A * c; n.z -= a.y * a.z * A * c; n.y -= b.x * a.z * A * s;
  }
  float e = max(r - uR0, 0.0);
  vec2 rd = r > 0.001 ? lp / r : vec2(0.0);
  n.xz += rd * 2.0 * uBend * e;
  vec3 w = vec3(p.x + d.x, uSeaY + d.y - uBend * e * e, p.y + d.z);
  vGN = n;

    rayBase.set(0, G.lift, G.shipZ - 48);
    pA[0].set(0, G.shipZ - 48, patchR, patchI);
    pL[0] = 48 * sstep(1.5, 4.0, t);
    waterU.uFront.value = lerp(440, -10, sstep(2.5, 6.5, t));
    waterU.uFrontI.value = sstep(2.3, 3.0, t) * (1 - sstep(6.3, 7.5, t)) * 1.2;
    G.mistB = sstep(3, 5, t) * (1 - sstep(9, 13, t) * 0.6);
    G.glitB = Math.max(G.glitB, sstep(1, 3, t) * 1.3 * (1 - sstep(9, 13, t) * 0.6));
    G.bloomB = Math.max(G.bloomB, sstep(0.8, 3.0, t) * (1 - sstep(10, 14, t) * 0.5));
    G.rimB = Math.max(G.rimB, lt);
    G.pathB = Math.max(G.pathB, sstep(2, 4, t)); G.pathW = 22;
    G.speedT = lerp(9.5, sp[0], sstep(6, 14, t));
    if (t > 5) G.lift = lerp(B.L0, B.L1, s5((t - 5) / 3.5));
    if (t > 4 && t < 4.1) targets.forEach(c => { c.alphaT = 0; c.fade = 2.0; });
    if (t > 13.5) {
      G.burst = null; G.free = true; G.focusMode = 'target'; G.climaxT = -1; waterU.uFrontI.value = 0;
      setState('FREE_PLAY');
      spawnTarget(64, {});
    }
  }
  if (!G.burst) {
    G.sunB *= Math.exp(-dt / 3); G.mistB *= Math.exp(-dt / 3);
    // waiting: approach slowly, never pass the target
    const dist = G.shipZ - G.target.z;
    let v = sp[0] * clamp((dist - 25) / 16, 0, 1);
    if (dist < 27) {
      v = Math.max(v, 0.35);
      const drift = 0.35 * dt * clamp((27 - dist) / 2, 0, 1);
      G.target.z -= drift; if (G.curCloud) { for (const c of targets) if (c.active && c.alphaT > 0) c.base.z -= drift; }
    }
    G.speedT = v;
    if (G.state === 'START') G.speedT = Math.max(v, 0.3);
    G.windT = Math.max(0.22 + si * 0.05, G.windT * Math.exp(-dt / 0.8));
  } else if (!G.burst.climax && G.burst.t > 3.6) { /* handled above */ }
  G.pathB *= Math.exp(-dt / (G.n >= 5 ? 9 : 4)); if (G.n >= 5) G.pathB = Math.max(G.pathB, 0.22);
  G.pathW += (6 - G.pathW) * (1 - Math.exp(-dt / 8));
  G.wakeB += (1 - G.wakeB) * (1 - Math.exp(-dt / 1.5));
  if (G.speedT > G.speed) G.speed += (G.speedT - G.speed) * (1 - Math.exp(-dt / 0.55));
  else G.speed += (G.speedT - G.speed) * (1 - Math.exp(-dt / 1.1));
  // never pass the waiting target
  if (!G.burst || G.burst.t > 4) { const dist = G.shipZ - G.target.z; if (dist < 24) G.speed = Math.min(G.speed, 0.36); }
  G.shipZ -= G.speed * dt;
  // wind and sail
  const tauW = G.windT > G.wind ? 0.14 : 0.9;
  G.wind += (G.windT - G.wind) * (1 - Math.exp(-dt / tauW));
  G.flutter = clamp((1 - G.wind) * 0.8 + (G.burst && G.burst.t < 0.6 ? 0.5 : 0), 0, 1);
  // light uniforms
  if (!G.burst) { pA[0].w *= Math.exp(-dt / 1.2); pL[0] *= Math.exp(-dt / 2); }
  else { pA[0].z = patchR; }
  if (G.burst) rays_set(rayBase, G.burst.climax ? 170 : 120, rayW0, rayW1, rayI, raySpread); else rays_set(rayBase, 120, rayW0, rayW1, 0, 0);
  waterU.uGlit.value = 1 + G.glitB;
  waterU.uPath.value = G.pathB; waterU.uPathW.value = G.pathW;
  U.uSunBoost.value = G.sunB;
  cloudU.uRim.value = 0.8 + G.rimB * 0.9;
  partU.uGlow.value = clamp(0.18 + G.mistB * 0.9 + patchI * 0.25, 0, 1);
  partU.uI.value = 0.55 + G.mistB * 0.7 + G.wind * 0.25;
  const bloomBase = 0.25;
  if (bloomPass) bloomPass.strength = G.burst && G.burst.climax ? lerp(bloomBase, 0.82, G.bloomB) : bloomBase + G.bloomB * 0.27;
  renderer.toneMappingExposure = 1.0 + G.sunB * 0.08;
  // finished?
  if (AUTOTEST && G.free && G.freeN >= 2 && G.state === 'FREE_PLAY' && G.st > 1) G.done = true;
}

function updateWorld(dt) {
  const t = G.time;
  U.uTime.value = t;
  U.uSeaY.value = G.lift;
  seaShape(G.lift);
  waterU.uBend.value = SEA.k; waterU.uR0.value = SEA.R0; waterU.uScale.value = SEA.R / SEA_R; waterU.uEdgeR.value = SEA.R;
  waterU.uCenter.value.set(0, G.shipZ);
  lowerU.uCenter.value.set(0, G.shipZ);
  const edgeY = SEA.edgeY;
  const fallH = Math.max(0.1, edgeY + 1);
  falls.scale.set(SEA.R, fallH, SEA.R); falls.position.set(0, edgeY - fallH / 2 + 0.3, G.shipZ);
  fallMat.uniforms.uVis.value = sstep(3, 18, edgeY);
  waterU.uEdgeFoam.value = sstep(3, 18, edgeY) * 0.8;
  deck.position.set(0, DECK_Y, G.shipZ);
  deckMat.uniforms.uVis.value = sstep(58, 84, G.lift);
  // ship
  const w = waveHeight(0, G.shipZ, t);
  ship.position.set(0, G.lift + w.y * 0.85 - 0.04, G.shipZ);
  const roll = clamp(-w.gx * 0.5, -2 * DEG, 2 * DEG) + Math.sin(t * 0.9) * 0.4 * DEG * (1 - G.wind);
  const pitch = clamp(w.gz * 0.5, -1.5 * DEG, 1.5 * DEG) - G.speed * 0.08 * DEG;
  ship.rotation.set(pitch, 0, roll);
  waterU.uShip.value.set(0, G.shipZ, G.speed, G.wakeB);
  updateSails(t, G.wind, G.flutter);
  matSail.emissiveIntensity = 0.04 + G.wind * 0.06 + G.sunB * 0.06;
  matSail.emissive.copy(U.uSunCol.value);
  sunLight.position.set(U.uSunDir.value.x * 60, G.lift + U.uSunDir.value.y * 60, G.shipZ + U.uSunDir.value.z * 60);
  sunLight.target.position.set(0, G.lift + 2, G.shipZ);
  // islands (fixed height, slow drift so they stay out beyond the raised sea)
  islands.forEach(m => { if (m.userData.bz - 0.14 * G.shipZ > -330) m.userData.bz -= 900; m.position.set(m.userData.bx, 0, m.userData.bz + G.shipZ * 0.86); });
  // particles box between boat and target
  partU.uBoxC.value.set(0, G.lift + 5.2, (G.shipZ + G.target.z) / 2 + 4);
  const wo = partU.uWOff.value;
  wo.z -= (1.2 + G.wind * 5.5) * dt;
  if (G.burst) wo.x += G.burst.dir * (G.burst.t < 2.5 ? 5 * G.wind : 1) * dt;
  sky.position.copy(camera.position);
  updateStreaks(dt);
  updateBirds(dt);
}

// ---------------------------------------------------------------------------
// autotest: drives the same pointer handlers as a real finger
// ---------------------------------------------------------------------------
const AT = { on: AUTOTEST, phase: 0, wait: 0, swipes: 0, cur: null, hold: false };
function fakeEv(id, x, y) { return { pointerId: id, clientX: x, clientY: y, isPrimary: id === 1, button: 0, preventDefault() {} }; }
function autotestTick(dt) {
  if (!AT.on || window.__atHold) return;
  const W = window.innerWidth, H = window.innerHeight;
  if (AT.cur) {
    const s = AT.cur; s.t += dt;
    while (s.k < s.steps && s.t > s.k * s.dt) {
      s.k++;
      const x = s.x0 + s.dir * s.k * s.step;
      PTR.t0 = performance.now() - 220;
      onMove(fakeEv(1, x, s.y));
      if (s.second && s.k === 2) { onDown(fakeEv(2, W * 0.3, H * 0.3)); onMove(fakeEv(2, W * 0.6, H * 0.3)); onUp(fakeEv(2, W * 0.6, H * 0.3)); }
    }
    if (s.k >= s.steps) { onUp(fakeEv(1, s.x0 + s.dir * s.steps * s.step, s.y)); AT.cur = null; AT.wait = 0; }
    return;
  }
  AT.wait += dt;
  const startSwipe = (dir, steps, step, second) => {
    const x0 = W * 0.5 - dir * steps * step * 0.5, y = H * (0.45 + rnd() * 0.2);
    PTR.t0 = performance.now();
    onDown(fakeEv(1, x0, y));
    AT.cur = { t: 0, k: 0, steps, step, dt: 0.035, dir, x0, y, second };
  };
  if (G.state === 'START') { if (AT.wait > 1.5) { onDown(fakeEv(1, W * 0.5, H * 0.55)); onUp(fakeEv(1, W * 0.5, H * 0.55)); AT.wait = 0; } return; }
  const ready = (G.state === 'WAIT_WIND' || G.state === 'FREE_PLAY') && G.st > 0.9;
  if (!ready) { AT.wait = 0; return; }
  const k = G.n + G.freeN;
  if (k === 1 && G.hints < 2) return;                 // let the idle hint play twice once
  if (k === 3 && !AT.tiny) { AT.tiny = true; startSwipe(1, 2, 5, false); return; } // too short: must not count
  if (AT.wait < 0.6) return;
  const dir = k % 2 ? -1 : 1;
  startSwipe(dir, 8, 6 + (k % 3), k === 4);
  AT.swipes++;
}

// ---------------------------------------------------------------------------
// debug hook (read only) for tests
// ---------------------------------------------------------------------------
const pj = new THREE.Vector3();
function toScreen(v) { pj.copy(v).project(camera); return [+((pj.x * 0.5 + 0.5) * 100).toFixed(1), +((0.5 - pj.y * 0.5) * 100).toFixed(1)]; }
window.__d14 = {
  get state() { return G.state; }, get n() { return G.n; }, get freeN() { return G.freeN; }, get stage() { return stageIdx() + 1; },
  get lift() { return +G.lift.toFixed(2); }, get speed() { return +G.speed.toFixed(2); }, get q() { return QA.cur; }, get fps() { return QA.fps; },
  get seen() { return [...G.seen]; }, get done() { return G.done; }, get taps() { return G.taps; }, get gestures() { return G.gestures; }, get hints() { return G.hints; },
  get settled() { return (G.state === 'WAIT_WIND' || G.state === 'FREE_PLAY') && G.st > 1.6; },
  get climaxT() { return G.climaxT; },
  view() {
    const ft = G.burst && !G.burst.climax && G.burst.t < 4 ? G.burst.target : G.target;
    const tgt = G.focusMode === 'climax' ? new THREE.Vector3(0, G.lift, G.shipZ - 48) : new THREE.Vector3(ft.x, G.lift, ft.z);
    const sc = toScreen(tgt);
    let x0 = 100, y0 = 100, x1 = 0, y1 = 0;
    ship.updateMatrixWorld();
    for (const p of SHIP_PTS) { const s = toScreen(pv.copy(p).applyMatrix4(ship.matrixWorld)); x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); y0 = Math.min(y0, s[1]); y1 = Math.max(y1, s[1]); }
    return { target: sc, ship: [x0, y0, x1, y1].map(v => +v.toFixed(1)), camS: +(G.camS || 0).toFixed(2), sunEl: +(Math.asin(U.uSunDir.value.y) / DEG).toFixed(1) };
  },
};
if (DBG) window.__dbg = { G, U, waterU, camera, scene, targets, bgClouds, applyQuality, get bloom() { return bloomPass; } };

// ---------------------------------------------------------------------------
// loop
// ---------------------------------------------------------------------------
applyQuality(QA.cur);
updatePalette(0.016);
spawnTarget(40, {});
targets.forEach(c => { if (c.active) c.alpha = 1; });
bgClouds.forEach(c => { c.alpha = 1; });
let lastT = performance.now(), frames = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const raw = (now - lastT) / 1000; lastT = now;
  const dt = Math.min(raw, AUTOTEST ? 0.25 : 0.1) * SPEED;
  try {
    autotestTick(dt);
    updatePalette(dt);
    updateGame(dt);
    updateHint(dt);
    updateWorld(dt);
    updateCamera(dt);
    updateClouds(dt);
    updateAudio(dt);
    if (composer && QUAL[QA.cur].bloom > 0) composer.render(); else renderer.render(scene, camera);
  } catch (e) { if (window.__pushErr && !frame.err) { frame.err = 1; window.__pushErr('frame: ' + (e && (e.stack || e.message) || e)); } }
  qualityTick(raw);
  frames++;
  if (frames === 3) {
    window.__ready = true;
    const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 1200); }
    if (DBG) console.log('init ms', Math.round(now - T_START));
  }
}
requestAnimationFrame(frame);
</script>
