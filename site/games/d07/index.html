// ================================================================ resize & loop
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; updateFov();
  renderer.setSize(w, h);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  PU.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * D2R / 2));
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
  computeBreachDists();
  QM.hold = 2;
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

let lastNow = performance.now(), frames = 0, started = false;
function update(dt, rdt) {
  U.uTime.value += dt;
  // stage transition
  const df = ST.target - ST.f;
  if (Math.abs(df) > 1e-4) ST.f += Math.sign(df) * Math.min(Math.abs(df), dt * ST.rate);
  applyPalette();
  if (Math.abs(ST.f - ST.envF) > 0.1 && U.uTime.value - ST.envT > 1.0) { ST.envT = U.uTime.value; updateEnv(); }
  if (renderer.shadowMap.enabled && sun.castShadow && Math.abs(ST.f - ST.shadowF) > 0.05) { ST.shadowF = ST.f; renderer.shadowMap.needsUpdate = true; }

  if (G.state !== 'SPLASH' && G.state !== 'WAVE') G.landedSet = false;

  drops.update(dt); glow.update(dt); bubs.update(dt);

  // aura
  const ag = ATM.climaxGlow;
  auraG.position.copy(W.pose.p); auraB.position.copy(W.pose.p);
  auraG.material.opacity = ag * 0.14; auraB.material.opacity = ag * 0.09;
  WUNI.uGlow.value = ag * 0.55; WUNI.uGlowCol.value.set('#ffd9a0').lerp(cTmp.set('#bde7ff'), 0.5 + 0.5 * Math.sin(U.uTime.value * 0.6));
  if (bloomPass) { bloomPass.strength = lerp(0.3, 0.42, ATM.bloomK) * lerp(1, 0.75, ATM.night); bloomPass.radius = lerp(0.4, 0.1, Math.max(ATM.bloomK, ATM.night * 0.6)); bloomPass.threshold = lerp(1.0, 2.2, Math.max(ATM.bloomK, ATM.night * 0.5)); }

  SEA.uGoldBoost.value = (W.jump && W.jump.center ? 1.5 : 1) * (1 + 0.3 * stageOf(Math.max(0, G.round - 1)));
  under.position.x = SEA.uFocus.value.x; under.position.z = SEA.uFocus.value.z;
  fill.position.copy(camera.position).add(tv.set(4, 10, 0)); fill.target.position.set(CAM.t.x.x, 0, CAM.t.z.x - 20);
}
function render() {
  if (composer) composer.render(); else renderer.render(scene, camera);
}
function frame(now) {

}

function init() {

  camera.aspect = window.innerWidth / window.innerHeight; updateFov();
  applyQuality(qName, true);
  applyPalette(); updateEnv();
  G.circle.copy(circlePosFor(0));
  W.pose.p.set(G.circle.x + 6, -1.8, G.circle.z + 1); W.pose.yaw = -PI / 2; W.cr.dir = -1;
  cruiseInitFromPose(); W.prevPos.copy(W.pose.p);
  computeBreachDists();
  CAM.t.x.x = G.circle.x; CAM.t.y.x = 0.35; CAM.t.z.x = G.circle.z; CAM.d.x = 32;
  if (AUTOTEST && QS.get('lit')) { const n = clamp(parseInt(QS.get('lit')) || 0, 0, 19); for (let i = 0; i < n; i++) G.secStart[i] = -100; G.lit = n; G.round = n; ST.f = ST.target = Math.min(3, Math.floor(n / 5)); G.circle.copy(circlePosFor(n)); AT.firstWait = 2; }

try { init(); } catch (e) { errPush('init', e); }
