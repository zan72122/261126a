    if (window.__errors.length < 50) window.__errors.push('frame: ' + (e && e.stack || e));
  }
  frames++;
  if (frames === 3) { window.__ready = true; const v = document.getElementById('veil'); if (v) v.style.opacity = '0'; log('ready', 'q=' + QM.cur); setState(G.idx === 0 ? 'READY' : 'WAIT_TOUCH'); }
}
requestAnimationFrame(frame);

} catch (e) {
  window.__errors.push('init: ' + (e && e.stack || e));
  console.error(e);
}
</script>
