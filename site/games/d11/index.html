// ============================================================ input (one finger)
let activePointer = null;
const cvs = renderer.domElement;
const projV = new V3();
function orbScreen() { projV.copy(orbS.P).project(camera); return { x: (projV.x * .5 + .5) * W, y: (-projV.y * .5 + .5) * H, r: orbS.scale / (2 * orbS.P.distanceTo(camera.position) * Math.tan(camera.fov * DEG / 2)) * H, z: projV.z }; }
function handleTap(x, y) {
  audioInit();
  if ((orbS.state === 'ready' || (orbS.state === 'forming' && orbS.ready))) {
    const s = orbScreen();
    const hr = Math.max(32, s.r * 1.7);
    if (s.z < 1 && Math.hypot(x - s.x, y - s.y) <= hr) { success(); return true; }
  }
  // elsewhere: a quiet shimmer only
  projV.set(x / W * 2 - 1, -(y / H) * 2 + 1, .5).unproject(camera).sub(camera.position).normalize();
  const p = tmpV.copy(camera.position).addScaledVector(projV, 18);
  for (let i = 0; i < 6; i++) spawn(p.x, p.y, p.z, (Math.random() - .5) * 1.5, (Math.random() - .5) * 1.5, (Math.random() - .5) * 1.5, .9, .22, U.uAurCol.value, 0);
  return false;
}
cvs.addEventListener('pointerdown', e => {
  if (activePointer !== null && activePointer !== e.pointerId) return;
  if (e.button !== undefined && e.button > 0) return;
  activePointer = e.pointerId;
  try { cvs.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
  handleTap(e.clientX, e.clientY);
}, { passive: false });
const endP = e => { if (e.pointerId === activePointer) { activePointer = null; try { cvs.releasePointerCapture(e.pointerId); } catch (x) {} } };
cvs.addEventListener('pointerup', endP); cvs.addEventListener('pointercancel', endP); cvs.addEventListener('lostpointercapture', endP);
['touchstart', 'touchmove', 'touchend'].forEach(n => document.addEventListener(n, e => { if (e.cancelable) e.preventDefault(); if (n === 'touchend') audioInit(); }, { passive: false }));
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.hidden) AU.ctx.suspend().catch(() => {}); else AU.ctx.resume().catch(() => {});
  lastT = performance.now();
});

// ============================================================ main loop
let lastT = performance.now(), frames = 0;
applyQuality(qName);
orbS.nextIdx = 0;
// place everything for the first frame
updateWorld(0); updateCamera(0); spawnOrb(); orbS.t0 = -1; updateOrb(0); updateCamera(0);
const hooks = window.__d11 = {
  get state() { return G.state; }, get k() { return G.k; }, get q() { return qName; }, get fps() { return FPS.fps; },
  get orbReady() { return orbS.ready && (orbS.state === 'ready' || orbS.state === 'forming'); },
  orb() { const s = orbScreen(); return { x: s.x, y: s.y, r: s.r, w: W, h: H }; },
  get boatS() { return G.boatS; }, get boatY() { return G.liftY; }, get speed() { return G.speed; }, get base() { return G.base; }, get lift() { return G.lift; },
  release() { if (!release.visible) return null; projV.copy(release.position).project(camera); return { x: (projV.x * .5 + .5) * W, y: (-projV.y * .5 + .5) * H, r: release.scale.x * .5 / (2 * release.position.distanceTo(camera.position) * Math.tan(camera.fov * DEG / 2)) * H }; }
};
if (QS.has('dbg')) window.__dbg = { ribbon, ribCurtain, parts, release, bands, orb, G, U, ribbonU, THREE, camera };
function frame() {
  requestAnimationFrame(frame);
  try {
    const now = performance.now(); let rdt = (now - lastT) / 1000; lastT = now;
    if (rdt > .1) rdt = .1; if (rdt < 0) rdt = 0;
    const dt = rdt * SPEED;
    G.t += dt;
    qualityTick(rdt);
    updateWorld(dt);
    updateCamera(dt);
    updateOrb(dt);
    updateParts(dt);
    ambienceUpdate(dt);
    sky.position.copy(camera.position); stars.position.copy(camera.position);
    partMat.uniforms.uScale.value = H * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * DEG / 2));
    // bloom
    if (curQ.bloom) {
      const ct = G.state === ST.CLIMAX ? G.t - G.climaxT : -1;
      const boost = ct >= 0 ? sstep(.3, 2.5, ct) * (1 - sstep(7, 13, ct)) : 0;
      G.bloomBoost = damp(G.bloomBoost, boost, .6, dt);
      bloom.strength = lerp(.5, .72, G.P) + G.bloomBoost * .45;

    renderMirror();
    water.visible = true; ice.visible = true;

  } catch (e) { errPush('frame: ' + (e && e.message)); }
}
requestAnimationFrame(frame);

// ============================================================ autotest: drive the same pointer path
if (AUTOTEST) {
  let nextTap = 1.2 / SPEED, missDone = 0;
  setInterval(() => {
    if (!window.__ready) return;
    const tt = G.t;
    if (orbS.ready && (orbS.state === 'ready' || orbS.state === 'forming') && orbS.state !== 'pop') {

} catch (e) { errPush('init: ' + (e && e.stack || e)); console.error(e); }
