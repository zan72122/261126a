<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================ basics
const V3 = THREE.Vector3;
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease3 = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const dk = (rate, dt) => 1 - Math.exp(-rate * dt);
function mulberry(s) { return function () { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry(20261126);
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}
const col = h => new THREE.Color(h);

const QS = new URLSearchParams(location.search);
const AUTOTEST = QS.has('autotest');
const SPEED = AUTOTEST ? (parseFloat(QS.get('speed')) || 2) : 1;
const QFORCED = ['low', 'mid', 'high'].includes(QS.get('q')) ? QS.get('q') : null;
const QSET = {
  low:  { pr: 1.0,  bloom: 0, glow: 250,  bub: 40,  rays: 2, wq: 1, coral: 0.35, snow: 360,  mote: 120, seg: 64,  trail: 0.6 },
  mid:  { pr: 1.25, bloom: 1, glow: 600,  bub: 90,  rays: 4, wq: 2, coral: 0.65, snow: 700,  mote: 260, seg: 96,  trail: 1.0 },
  high: { pr: 1.75, bloom: 2, glow: 1200, bub: 180, rays: 8, wq: 4, coral: 1.0,  snow: 1200, mote: 480, seg: 128, trail: 1.4 }
};
let qName = QFORCED || 'mid';
let Q = QSET[qName];

const MOON_DIR = new V3(0, Math.sin(11 * D2R), -Math.cos(11 * D2R));
const MOON_W = new V3(0, Math.sin(43 * D2R), -Math.cos(43 * D2R));
const CLIMAX_AXIS = new V3(0, Math.sin(40 * D2R), -Math.cos(40 * D2R));
const WUP = new V3(0, 1, 0);

const STAGES = [
  { n: 4, R: 2.75, y: -38, base: col('#12365F'), far: col('#102746'), amb: col('#8EBBFF'), rim: col('#D8F5FF'), fogN: 8,  fogF: 55,  bloom: .35,
    m1: col('#cfe8ff'), m2: col('#8fdcff'), m3: col('#bfefff') },
  { n: 6, R: 3.75, y: -28, base: col('#104E78'), far: col('#195B84'), amb: col('#A3E7FF'), rim: col('#C2FFFF'), fogN: 12, fogF: 75,  bloom: .50,
    m1: col('#8ff0ff'), m2: col('#c9b8ff'), m3: col('#fff0f5') },
  { n: 8, R: 4.75, y: -24, base: col('#1C679B'), far: col('#2E7DAE'), amb: col('#D1F3FF'), rim: col('#E2FBFF'), fogN: 18, fogF: 110, bloom: .65,
    m1: col('#ffffff'), m2: col('#ffe3a0'), m3: col('#d8f4ff') }
];
const GOLD = col('#FFF6DD');
const SKY_ZEN = col('#142B60'), SKY_MID = col('#345F9A'), SKY_HOR = col('#829DC9');
const MOON_C = col('#FFF5D9'), MOON_HALO = col('#BFDFFF'), MOONLIGHT = col('#C5DEFF');

// ============================================================ renderer / scene
const canvas = document.createElement('canvas');
canvas.setAttribute('tabindex', '-1');
document.body.insertBefore(canvas, document.body.firstChild);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: qName !== 'low', powerPreference: 'high-performance', alpha: false });
} catch (e) {
  window.__errors.push('webgl: ' + (e && e.message || e));
  throw e;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.setClearColor(0x0b2545, 1);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); }, false);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x102746, 8, 55);
const camera = new THREE.PerspectiveCamera(48, 1, 0.06, 1600);
scene.add(camera);

let VW = 1, VH = 1;
const PXU = { value: 500 };         // pixels per world unit at distance 1
const FOGF = { value: 55 };
const TIME = { value: 0 };

// lights
const hemi = new THREE.HemisphereLight(0x8EBBFF, 0x0a1a30, 1.05);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(MOONLIGHT, 1.55);
scene.add(moonLight); scene.add(moonLight.target);

// environment maps (procedural gradient spheres)
function makeEnv(top, mid, bot) {
  const s = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { t: { value: top }, m: { value: mid }, b: { value: bot } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform vec3 t,m,b; varying vec3 vP; void main(){ float h=vP.y; vec3 c = h>0. ? mix(m,t,pow(h,0.7)) : mix(m,b,pow(-h,0.6)); gl_FragColor=vec4(c,1.); }'
  });
  s.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), m));
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(s, 0.02);
  pm.dispose(); m.dispose();
  return rt.texture;
}
const ENV_WATER = makeEnv(new THREE.Color(0.55, 0.85, 1.1), new THREE.Color(0.06, 0.16, 0.3), new THREE.Color(0.01, 0.03, 0.07));
const ENV_SKY = makeEnv(new THREE.Color(0.18, 0.28, 0.55), new THREE.Color(0.35, 0.45, 0.7), new THREE.Color(0.02, 0.05, 0.12));
scene.environment = ENV_WATER;

// post
let composer = null, bloom = null, bloomScale = 1;
function buildComposer() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.45, 0.95);
  const orig = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => orig(Math.max(32, Math.round(w * bloomScale)), Math.max(32, Math.round(h * bloomScale)));
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

// ============================================================ shared GLSL
const NOISE_GLSL = `
float h13(vec3 p){ p = fract(p*0.3183099+0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=h13(vec3(i,1.)), b=h13(vec3(i+vec2(1.,0.),1.)), c=h13(vec3(i+vec2(0.,1.),1.)), d=h13(vec3(i+1.,1.));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm2(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*n2(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
`;
const SKY_U = {
  uZen: { value: SKY_ZEN.clone() }, uMid: { value: SKY_MID.clone() }, uHor: { value: SKY_HOR.clone() },
  uMoonDir: { value: MOON_DIR.clone() }, uMoonW: { value: MOON_W.clone() }, uMoonCol: { value: MOON_C.clone() }, uHaloCol: { value: MOON_HALO.clone() },
  uBase: { value: STAGES[0].base.clone() }, uFar: { value: STAGES[0].far.clone() }, uAmb: { value: STAGES[0].amb.clone() },
  uAbove: { value: 0 }, uStars: { value: 0 }, uTime: TIME
};
const FOG_OUT = { value: new THREE.Color() };
const SKY_GLSL = NOISE_GLSL + `
uniform vec3 uZen, uMid, uHor, uMoonDir, uMoonW, uMoonCol, uHaloCol, uBase, uFar, uAmb;
uniform float uAbove, uStars, uTime;
vec3 skyAbove(vec3 d){
  float h = d.y;
  vec3 c = mix(uHor, uMid, smoothstep(0.0, 0.28, h));
  c = mix(c, uZen, smoothstep(0.28, 0.9, h));
  float md = max(dot(d, uMoonDir), 0.0);
  c += uHaloCol * (pow(md, 1500.0)*0.25 + pow(md, 160.0)*0.10 + pow(md, 12.0)*0.035);
  if (h > 0.0) {
    vec3 p = d*95.0; vec3 ip = floor(p); vec3 fp = fract(p) - 0.5;
    float r0 = h13(ip);
    if (r0 > 0.962) {
      vec3 off = vec3(h13(ip+3.1), h13(ip+7.7), h13(ip+1.9)) - 0.5;
      float r = length(fp - off*0.5);
      float tw = 0.65 + 0.35*sin(uTime*(1.0+r0*3.0) + r0*40.0);
      float b = smoothstep(0.17, 0.0, r) * (r0-0.962)/0.038 * tw;
      c += vec3(0.85,0.9,1.0) * b * 1.5 * uStars * smoothstep(0.02, 0.2, h) * (1.0 - smoothstep(0.95, 0.993, md));
    }
    vec2 cp = d.xz / (h + 0.18) * 1.2 + vec2(uTime*0.006, 0.0);
    float cl = fbm2(cp);
    float ca = smoothstep(0.56, 0.86, cl) * 0.42 * smoothstep(0.0, 0.15, h) * (1.0 - smoothstep(0.93, 0.985, md));
    vec3 ccol = mix(uMid*0.85, uHaloCol*0.55, pow(md, 4.0));
    c = mix(c, ccol, ca);
  } else {
    float k = -h;
    vec3 sea = mix(uHor*0.72, vec3(0.012,0.03,0.07), smoothstep(0.0, 0.22, k));
    vec2 az = normalize(d.xz + 1e-5); vec2 maz = normalize(uMoonDir.xz);
    float a = max(dot(az, maz), 0.0);
    float glade = pow(a, 700.0) * smoothstep(0.3, 0.0, k);
    float sp = n2(vec2(atan(d.x, -d.z)*900.0, log(k+0.002)*40.0 - uTime*1.5));
    sea += uMoonCol * glade * (0.25 + 1.5*sp*sp);
    c = sea;
  }
  return c;
}
vec3 skyBelow(vec3 d){
  float h = d.y;
  vec3 c = mix(uFar, uBase + uAmb*0.05, smoothstep(0.0, 0.75, h));
  c = mix(c, uFar*0.42, smoothstep(0.0, -0.85, h));
  float md = max(dot(d, uMoonW), 0.0);
  c += uAmb * (pow(md, 5.0)*0.16 + pow(md, 40.0)*0.25) * smoothstep(0.0, 0.5, h);
  return c;
}
`;
const OUT_GLSL = `
#include <tonemapping_fragment>
#include <colorspace_fragment>
`;

// ============================================================ dome (water / sky)
const dome = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: Object.assign({ uFogOut: FOG_OUT }, SKY_U),
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  // three.js mixes fog in output space, so the horizon band is blended the same way to stay seamless
  fragmentShader: SKY_GLSL + 'uniform vec3 uFogOut; varying vec3 vD; void main(){ vec3 d = normalize(vD); vec3 c = mix(skyBelow(d), skyAbove(d), uAbove); gl_FragColor = vec4(c,1.);' + OUT_GLSL +
    ' float hb = 1.0 - smoothstep(0.03, 0.32, d.y); gl_FragColor.rgb = mix(gl_FragColor.rgb, uFogOut, hb*(1.0-uAbove)); }'
}));
dome.renderOrder = -10; dome.frustumCulled = false;
scene.add(dome);

// ============================================================ moon
const MOON_U = { uOp: { value: 0 }, uMB: { value: 1.8 }, uMoonCol: SKY_U.uMoonCol, uHaloCol: SKY_U.uHaloCol };
const moon = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, uniforms: MOON_U,
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: NOISE_GLSL + `uniform float uOp; uniform float uMB; uniform vec3 uMoonCol; varying vec2 vUv;
  void main(){ vec2 p = vUv*2.-1.; float r = length(p); if (r > 1.0) discard;
    float edge = smoothstep(1.0, 0.955, r);
    vec3 sp = vec3(p, sqrt(max(0., 1.-r*r)));
    float m = fbm2(sp.xy*2.1 + vec2(3.1, 1.7));
    float mare = smoothstep(0.46, 0.70, m);
    float cr = n2(sp.xy*11.0 + 4.0); float craters = smoothstep(0.72, 0.9, cr)*0.12;
    float fine = fbm2(sp.xy*24.0)*0.10;
    float limb = 0.72 + 0.28*sp.z;
    vec3 c = uMoonCol * (1.0 - mare*0.30 - craters - fine + 0.05) * limb * uMB;
    gl_FragColor = vec4(c, edge*uOp);` + OUT_GLSL + '}'
}));
moon.renderOrder = -5; moon.frustumCulled = false;
const moonHalo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending, uniforms: MOON_U,
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform float uOp; uniform vec3 uHaloCol; varying vec2 vUv;
  void main(){ vec2 p = vUv*2.-1.; float r = length(p); float a = exp(-r*r*30.0)*0.22 + exp(-r*6.0)*0.08; a *= smoothstep(1.0, 0.6, r);
    gl_FragColor = vec4(uHaloCol*a*uOp, 1.0);` + OUT_GLSL + '}'
}));
moonHalo.renderOrder = -6; moonHalo.frustumCulled = false;
scene.add(moonHalo); scene.add(moon);

// ============================================================ water surface
const SURF_U = Object.assign({ uFogOut: FOG_OUT }, SKY_U, {
  uQ: { value: 2 }, uFogC: { value: new THREE.Color() }, uFogN: { value: 8 }, uFogF: { value: 55 }, uDeep: { value: col('#06162c') }
});
const surfMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide, transparent: true, depthWrite: true, fog: false, uniforms: SURF_U,
  vertexShader: `uniform float uTime; varying vec3 vW; varying vec3 vN;
  const vec4 WV[4] = vec4[4](vec4(0.83,-0.55,7.6,0.16), vec4(-0.41,-0.91,5.2,0.11), vec4(0.97,0.24,3.3,0.07), vec4(-0.75,0.66,2.2,0.045));
  void main(){ vec3 wp = (modelMatrix*vec4(position,1.)).xyz; float h=0.; vec2 g=vec2(0.);
    for(int i=0;i<4;i++){ vec4 w=WV[i]; float k=6.2832/w.z; float ph=k*dot(w.xy,wp.xz)-sqrt(9.8*k)*uTime*0.7+float(i)*2.1; h+=w.w*sin(ph); g+=w.w*k*cos(ph)*w.xy; }
    wp.y += h; vW = wp; vN = normalize(vec3(-g.x, 1.0, -g.y));
    gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.); }`,
  fragmentShader: SKY_GLSL + `uniform float uQ; uniform vec3 uFogC, uDeep, uFogOut; uniform float uFogN, uFogF; varying vec3 vW; varying vec3 vN;
  const vec4 FW[4] = vec4[4](vec4(0.31,0.95,1.35,0.028), vec4(-0.88,0.47,0.95,0.02), vec4(0.6,-0.8,1.1,0.024), vec4(-0.2,-0.98,0.8,0.014));
  void main(){
    vec2 g = vec2(0.);
    for (int i=0;i<4;i++){ if (float(i) >= uQ) break; vec4 w = FW[i]; float k = 6.2832/w.z; float ph = k*dot(w.xy, vW.xz) - sqrt(9.8*k)*uTime*0.7 + float(i)*1.7; g += w.w*k*cos(ph)*w.xy; }
    vec3 toCam = cameraPosition - vW; float dist = length(toCam); vec3 v = toCam/dist;
    float fd = 1.0 - smoothstep(8.0, 45.0, dist);
    vec3 n = normalize(mix(vec3(0.,1.,0.), vN, 0.35 + 0.65*(1.0 - smoothstep(30.0, 140.0, dist))) + vec3(-g.x, 0., -g.y)*fd);
    vec3 c; float alpha = 1.0;
    if (gl_FrontFacing) {
      float cosT = clamp(dot(n, v), 0., 1.);
      float F = 0.02 + 0.98*pow(1.-cosT, 5.);
      vec3 r = reflect(-v, n); r.y = abs(r.y) + 0.002; r = normalize(r);
      c = mix(uDeep, skyAbove(r), F);
      float s = max(dot(r, uMoonDir), 0.);
      c += uMoonCol * (pow(s, 500.)*3.5 + pow(s, 90.)*0.35 + pow(s, 14.)*0.03);
      float fk = smoothstep(70., 290., dist);
      c = mix(c, uHor*0.8, fk*0.85);
      alpha = mix(0.8, 1.0, max(F, fk));
    } else {
      vec3 nb = -normalize(mix(n, vec3(0.,1.,0.), 0.55)); vec3 I = -v;
      vec3 t = refract(I, nb, 1.333);
      if (dot(t,t) < 0.01) { c = mix(uFar*0.75, uBase + uAmb*0.05, 0.5); }
      else { vec3 tt = normalize(t); float cosI = clamp(dot(v, nb), 0., 1.); float F = 0.02+0.98*pow(1.-cosI,5.);
        c = mix(skyAbove(tt)*0.95, uFar*0.6, F);
        c += uMoonCol * pow(max(dot(tt, uMoonDir), 0.), 260.) * 2.2; }
      c = mix(c, skyBelow(-v), smoothstep(uFogN, uFogF, dist));
    }
    gl_FragColor = vec4(c, alpha);` + OUT_GLSL + `
    if (!gl_FrontFacing) { float hb = 1.0 - smoothstep(0.03, 0.32, -v.y); gl_FragColor.rgb = mix(gl_FragColor.rgb, uFogOut, hb*(1.0-uAbove)*smoothstep(uFogN, uFogF, dist)); }
  }`
});
let surface = null;
function buildSurface() {
  if (surface) { surface.geometry.dispose(); scene.remove(surface); }
  const g = new THREE.PlaneGeometry(320, 320, Q.seg, Q.seg); g.rotateX(-Math.PI / 2);
  surface = new THREE.Mesh(g, surfMat); surface.frustumCulled = false; surface.renderOrder = 2;
  scene.add(surface);
}

// ============================================================ points: glow particles
const GLOW_VS = `attribute vec3 aColor; attribute float aSize; attribute float aAlpha; uniform float uPx; uniform float uFogF;
varying vec3 vC; varying float vA;
void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv; float d = -mv.z;
  gl_PointSize = clamp(aSize*uPx/max(d,0.05), 1.2, 96.0); vC = aColor;
  vA = aAlpha * (1.0 - smoothstep(uFogF*0.6, uFogF*1.15, d)) * smoothstep(0.25, 0.9, d); }`;
const GLOW_FS = `uniform float uGain; varying vec3 vC; varying float vA;
void main(){ vec2 p = gl_PointCoord*2.-1.; float r = dot(p,p); if (r > 1.0) discard;
  float a = exp(-r*7.0) + exp(-r*2.4)*0.32;
  gl_FragColor = vec4(vC*uGain*a, vA);` + OUT_GLSL + '}';
class GlowPool {
  constructor(max) {
    this.max = max; this.limit = max; this.head = 0;
    this.pos = new Float32Array(max * 3); this.colr = new Float32Array(max * 3); this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    this.vel = new Float32Array(max * 3); this.life = new Float32Array(max); this.ml = new Float32Array(max); this.grav = new Float32Array(max); this.drag = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    this.aP = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aC = new THREE.BufferAttribute(this.colr, 3).setUsage(THREE.DynamicDrawUsage);

void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv; float d = -mv.z;

const SKIN_N = (() => {
  const N = 128, data = new Uint8Array(N * N * 4), hgt = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N;
    let h = 0, a = 1, f = 4;
    for (let o = 0; o < 4; o++) { h += a * (vn(u * f * 0.6 + o * 7.1, v * f * 1.6 + o * 3.3)); a *= 0.5; f *= 2; }
    hgt[y * N + x] = h;
  }
  // make tileable by blending edges
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    const hx = hgt[y * N + ((x + 1) % N)] - hgt[y * N + ((x + N - 1) % N)];
    const hy = hgt[((y + 1) % N) * N + x] - hgt[((y + N - 1) % N) * N + x];
    const nx = -hx * 2.2, ny = -hy * 2.2, nz = 1, l = Math.hypot(nx, ny, nz);
    data[i * 4] = (nx / l * 0.5 + 0.5) * 255; data[i * 4 + 1] = (ny / l * 0.5 + 0.5) * 255; data[i * 4 + 2] = (nz / l * 0.5 + 0.5) * 255; data[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 3); t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.needsUpdate = true; return t;
})();

const DOL_L = 2.8, DOL_NOSE = 1.4;

const PROFILE = [

  [0.012, 0.030, 0.027, 0.031, -0.030],
  [0.040, 0.045, 0.040, 0.047, -0.032],
  [0.072, 0.056, 0.056, 0.066, -0.034],
  [0.092, 0.105, 0.080, 0.094, -0.025],
  [0.130, 0.188, 0.135, 0.152, -0.006],
  [0.200, 0.248, 0.196, 0.205, 0.0],
  [0.300, 0.292, 0.250, 0.246, 0.0],
  [0.400, 0.302, 0.268, 0.252, 0.0],
  [0.500, 0.284, 0.250, 0.228, 0.004],
  [0.620, 0.228, 0.192, 0.168, 0.012],
  [0.740, 0.160, 0.130, 0.104, 0.020],
  [0.850, 0.106, 0.086, 0.058, 0.022],
  [0.930, 0.070, 0.056, 0.036, 0.022],
  [0.985, 0.046, 0.038, 0.025, 0.022],

function prof(c, s) {
  const T = PROFILE, n = T.length;

const PK = 1.1; // girth scale
const sgp = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);

function addAttrs(g, part, colorFn) {
  const n = g.attributes.position.count, P = g.attributes.position, N = g.attributes.normal;

    c[i * 3] = tc.r; c[i * 3 + 1] = tc.g; c[i * 3 + 2] = tc.b; a[i] = part;
    uv[i * 2] = P.getZ(i) * 1.5; uv[i * 2 + 1] = (P.getX(i) + P.getY(i)) * 1.5;

  // dorsal fin (falcate)
  const ds = new THREE.Shape();
  ds.moveTo(0.15, -0.07);

  ds.lineTo(0.15, -0.07);
  const dorsal = finFromShape(ds, 0.008, 0.022, 0.006, M_SIDE);
  dorsal.translate(0, 0.30, DOL_NOSE - 0.47 * DOL_L);
  addAttrs(dorsal, 1, (x, y, z, nx, ny, nz, c) => { c.copy(C_BACK).multiplyScalar(0.88); });

  const fs = new THREE.Shape();
  fs.moveTo(0.06, 0);
