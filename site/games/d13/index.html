window.__d13 = () => ({ state: game.state, hop: game.hop, taps: game.taps, stage: stageOf(Math.min(game.hop, 23)) + 1, stageMax: game.stageMax + 1, climax: game.climaxReached, climaxCount: game.climaxCount || 0, maxTaps: Math.max(game.maxTaps || 0, game.taps), replayReady: game.replayReady, plays: game.plays, fps: +QM.fps.toFixed(1), avgFps: QM.n ? +(QM.sum / QM.n).toFixed(1) : 0, q: qName, alt: +boat.pos.y.toFixed(1), sf: +envNow.sf.toFixed(2), seedOffMax: +frameStats.seedOffMax.toFixed(2), lastSeedOff: frameStats.lastSeedOff ? +frameStats.lastSeedOff.toFixed(2) : null, fitMax: +frameStats.fitMax.toFixed(3), climaxFitMax: +frameStats.climaxFitMax.toFixed(3), particles: parts.alive, errors: window.__errors.length });

let paused = false;

// autotest driver: dispatches real pointer events at the seed on screen

// ---------------------------------------------------------------- loop
let lastNow = performance.now();

// ---------------------------------------------------------------- init
