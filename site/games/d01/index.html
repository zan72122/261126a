        const kk = 1 - Math.exp(-dt * 1.6);
        if (e.lastSlot !== e.slot) { e.rel.copy(e.pos).sub(e.slotPos); }

        e.pos.copy(e.slotPos).add(e.rel);
        e.scale += (S - e.scale) * kk;
        e.yaw = angLerp(e.yaw, ty, 1 - Math.exp(-dt * 1.2));
      }

    }

    const rad = tpl ? radiiFor(tpl, N) : null;
    if (tpl && morph > 0) computeParts(tpl.def, e.animT, e.mats, e.rot, e.root);
    const cy = Math.cos(e.yaw), sy = Math.sin(e.yaw);
    const S = e.scale * e.form * (e.dissolve ? 1 + (1 - e.fade) * 0.4 : 1);
    const fade = e.dissolve ? e.fade : 1;
    const flag = e.isTarget ? 1 : 0;
    for (let j = 0; j < N; j++) {
      let x = e.cl[j * 3], y = e.cl[j * 3 + 1], z = e.cl[j * 3 + 2];
      const wob = Math.sin(t * 0.6 + j * 1.7) * 0.014;

      let r = e.cr[j] * kc;
      if (tpl && morph > 0) {

        if (mj > 0) {

          const swr = Math.sin(Math.PI * mj) * 0.16;

          y = lerp(y, _v3.y, mj) + swr * Math.cos(j * 1.9) * 0.5;

          r = lerp(r, rad[j] * tpl.norm, mj);
        }
      }
      if (e.dissolve) { x *= 1 + (1 - fade) * 0.5; y *= 1 + (1 - fade) * 0.5; }

      const wx = e.pos.x + (x * cy + z * sy) * S, wy = e.pos.y + y * S, wz = e.pos.z + (-x * sy + z * cy) * S;
      e.wp[j * 3] = wx; e.wp[j * 3 + 1] = wy; e.wp[j * 3 + 2] = wz; e.wr[j] = rw;
      if (pi < PUFF_CAP) {
        const o = pi * 16;
        SCR_M[o] = rw; SCR_M[o + 1] = 0; SCR_M[o + 2] = 0; SCR_M[o + 3] = 0;
        SCR_M[o + 4] = 0; SCR_M[o + 5] = rw; SCR_M[o + 6] = 0; SCR_M[o + 7] = 0;
        SCR_M[o + 8] = 0; SCR_M[o + 9] = 0; SCR_M[o + 10] = rw; SCR_M[o + 11] = 0;
        SCR_M[o + 12] = wx; SCR_M[o + 13] = wy; SCR_M[o + 14] = wz; SCR_M[o + 15] = 1;
        const f4 = pi * 4;
        SCR_F[f4] = e.glow; SCR_F[f4 + 1] = flag; SCR_F[f4 + 2] = (j * 0.137 + e.id * 0.71) % 1; SCR_F[f4 + 3] = e.silver * (0.94 + 0.08 * ((j * 7) % 5) / 4);

    for (let i = 0; i < wN && wi < wisps.cap; i++) {

      const rr2 = e.wr[j] * (1.08 + 0.18 * Math.sin(t * 0.9 + i));
      wisps.p[wi * 3] = e.wp[j * 3] + WISP_DIR[i * 3] * rr2;
      wisps.p[wi * 3 + 1] = e.wp[j * 3 + 1] + WISP_DIR[i * 3 + 1] * rr2;
      wisps.p[wi * 3 + 2] = e.wp[j * 3 + 2] + WISP_DIR[i * 3 + 2] * rr2;
      wisps.c[wi * 3] = C.cl.r * 0.9; wisps.c[wi * 3 + 1] = C.cl.g * 0.9; wisps.c[wi * 3 + 2] = C.cl.b;

  const idx = SORT_IDX.subarray(0, pi);
  idx.sort((a, b) => SCR_D[b] - SCR_D[a]);
  const im = puffMesh.instanceMatrix.array, fx = puffMesh.geometry.attributes.aFx.array;
  for (let k = 0; k < pi; k++) {
    const s = idx[k];
    const so = s * 16, ko = k * 16;
    for (let q = 0; q < 16; q++) im[ko + q] = SCR_M[so + q];
    fx[k * 4] = SCR_F[s * 4]; fx[k * 4 + 1] = SCR_F[s * 4 + 1]; fx[k * 4 + 2] = SCR_F[s * 4 + 2]; fx[k * 4 + 3] = SCR_F[s * 4 + 3];
  }

  puffMesh.instanceMatrix.needsUpdate = true;
  puffMesh.geometry.attributes.aFx.needsUpdate = true;
}

function updateMotes(dt) {
  const n = Math.min(220, Q.motes);
  let v = 6 + 14 * (G.p / 18);
  if (G.state === 'CLIMAX') v += 50 * sstep(2, 8, G.st) * (1 - sstep(10.5, 13.5, G.st));
  const gold = sstep(12, 18, G.p);
  _c1.copy(SILVER).lerp(WHITE_GOLD, gold * 0.6);
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    MOTE[o + 2] += v * dt;
    if (MOTE[o + 2] > 50) { MOTE[o + 2] -= 330; MOTE[o] = rr(-95, 95); MOTE[o + 1] = rr(-45, 55); }
    const x = MOTE[o], y = MOTE[o + 1], z = MOTE[o + 2];
    if (Math.abs(x) < 9 && Math.abs(y) < 7 && z > -8 && z < 42) { motes.sa[i * 2 + 1] = 0; }
    else motes.sa[i * 2 + 1] = 0.32 * sstep(50, 30, z) * sstep(-280, -230, z);
    motes.p[i * 3] = rig.x + x; motes.p[i * 3 + 1] = rig.y + y; motes.p[i * 3 + 2] = rig.z + z;
    motes.c[i * 3] = _c1.r; motes.c[i * 3 + 1] = _c1.g; motes.c[i * 3 + 2] = _c1.b;
    motes.sa[i * 2] = MOTE[o + 3];
  }
  motes.flush(n);
}

function updateTownLights() {
  for (let i = 0; i < LIGHT_SRC.length && i < 44; i++) {
    const s = LIGHT_SRC[i];
    const lit = clamp((G.t - U.uLitT.value[s.g]) * 0.72 / 1.0, 0, 1);
    let w = 0.1 + 0.9 * lit;
    if (G.wave) w *= 1 + G.wave.s * 0.8 * Math.exp(-Math.pow((s.z - U.uWaveZ.value) / 90, 2)) * U.uWaveS.value;
    LIGHTS[i].w = w * (i >= 26 ? 0.8 : 1);
  }
  if (G.wave) {
    G.wave.t += G.dtLast;
    const wt = G.wave.t;
    U.uWaveZ.value = G.wave.z0 - wt * 330;
    U.uWaveS.value = G.wave.s * sstep(0, 0.5, wt) * (1 - sstep(3.2, 4.5, wt));
    if (wt > 4.5) { G.wave = null; U.uWaveS.value = 0; }
  }
}

function update(dt) {
  G.t += dt; G.dtLast = dt; U.uTime.value = G.t;
  // progress
  G.p += (G.pT - G.p) * (1 - Math.exp(-dt * 0.95));
  if (Math.abs(G.pT - G.p) < 0.002) G.p = G.pT;
  if (G.state !== 'CLIMAX') {
    const zNow = 650 - 22 * G.p - G.drift + G.climaxOff.z;
    if (zNow > -520) G.drift += 1.2 * dt;
  }
  rig.set(0, altOf(G.p), 650 - 22 * G.p - G.drift).add(G.climaxOff);
  // palette & atmosphere
  let u = clamp((G.p - 3) / 6, 0, 2);
  if (G.reached) u = 2;
  applyPalette(u);
  U.uFogC.value.copy(C.hor).lerp(C.zen, 0.18).multiplyScalar(0.56); scene.fog.color.copy(U.uFogC.value);
  const far = lerp(1450, 2150, G.p / 18);
  U.uFog.value.set(260, far); scene.fog.near = 260; scene.fog.far = far;
  renderer.setClearColor(U.uFogC.value);
  // camera
  const starLook = G.starMode || G.state === 'STAR_WAITING' || (G.state === 'CLIMAX' && G.st < 10.8);
  camOffT.set(0, starLook ? 4.5 : 7.5, starLook ? 34 : 29).multiplyScalar(view.k);
  camOff.lerp(camOffT, 1 - Math.exp(-dt * 0.7));
  camera.position.copy(rig).add(camOff);
  if (starLook) _v3.copy(STAR_DIR); else _v3.copy(rig).add(F_LOCAL).sub(camera.position).normalize();
  const ang = lookDir.angleTo(_v3);
  if (ang > 1e-5) {
    const step = Math.min(ang, Math.max(ang * (1 - Math.exp(-dt * 2.4)), 0), THREE.MathUtils.degToRad(9) * dt);
    const want = ang < THREE.MathUtils.degToRad(0.4) ? ang : step;
    lookDir.lerp(_v3, want / ang).normalize();
  }

  bird.position.set(0, 0, 0);
  updateBird(dt, G.t);
  bird.position.add(rig);
  // state machine
  updateState(dt);
  updateStar(dt);
  updateEntities(dt);
  updateMotes(dt);
  updateTownLights();
  pool.update(dt);
  // rings
  for (const r of rings) {
    r.t += dt;
    const k = clamp(r.t / 0.65, 0, 1);
    r.s.material.opacity = r.t < 0.65 ? (1 - k) * 0.9 : 0;
    r.s.scale.setScalar(lerp(2, r.max || 30, ease(k)));

  water.position.set(camera.position.x, 0, camera.position.z);

  moonHalo.position.copy(moonMesh.position);

  skyMat.uniforms.uStarG.value = 0.25 + 0.75 * sstep(6, 18, G.p) + climaxGlow * 2 + (G.state === 'STAR_WAITING' ? 0.4 : 0);
  skyMat.uniforms.uRainbow.value = 0.6 * sstep(12, 18, G.p) + (G.reached ? 0.6 * (G.state === 'CLIMAX' ? sstep(10.5, 13, G.st) : 1) : 0);
  skyMat.uniforms.uBoost.value = 0.3 * climaxGlow;
  starsMat.uniforms.uBright.value = 0.7 + (G.reached ? 0.25 : 0);
  U.uStarRim.value = sstep(12, 18, G.p) + 1.5 * climaxGlow;
  U.uGold.value += ((G.state === 'CLIMAX' ? sstep(10.5, 12.5, G.st) : G.reached ? 0.3 : 0) - U.uGold.value) * (1 - Math.exp(-dt * 0.8));

  _v3.set(rig.x, 0, rig.z - 320);

  if (bloomPass) bloomPass.strength = 0.5 + 0.25 * sstep(14, 18, G.p) + (G.state === 'CLIMAX' ? 0.2 * sstep(4, 9, G.st) * (1 - sstep(12, 16, G.st)) : 0);

      _v3.copy(camF).multiplyScalar(-90).addScaledVector(camR, Math.cos(a) * 55).addScaledVector(camUp, Math.sin(a) * 55);
      pool.spawn(_tp.x, _tp.y, _tp.z, _v3.x, _v3.y, _v3.z, rnd() < 0.5 ? WHITE_GOLD : SILVER, rr(1.0, 2.2), 0.9, rr(2.0, 3.2), 0);
    }

      G.relAcc = (G.relAcc || 0) + dt * Q.parts / 8;
      while (G.relAcc > 1) {

        _v3.set(rr(-1, 1), rr(0.05, 0.9), rr(-1, 0.3)).normalize();
        _tp.copy(camera.position).addScaledVector(_v3, rr(180, 520));
        _c2.setHSL(rnd() < 0.6 ? 0.12 : rr(0.5, 0.9), 0.7, 0.75);
        pool.spawn(_tp.x, _tp.y, _tp.z, rr(-2, 2), rr(-2, 1), rr(-2, 2), _c2, rr(3, 7), 0.9, rr(4, 7), 0.1);

}

// ------------------------------------------------------------------ test hooks (no visual output)
function ndcBounds() {
  const out = { target: null, comps: [-0, 0, 0, 0], wings: [], n: G.comps.length, state: G.state };
  let mnx = 9, mxx = -9, mny = 9, mxy = -9;
  for (const e of G.comps) {
    if (!e.active || e.join < 1) continue;
    projectNDC(e.pos, _tp);
    const d = camera.position.distanceTo(e.pos);
    const rx = e.scale * 0.5 / (d * view.tanH), ry = e.scale * 0.5 / (d * view.tanV);
    mnx = Math.min(mnx, _tp.x - rx); mxx = Math.max(mxx, _tp.x + rx); mny = Math.min(mny, _tp.y - ry); mxy = Math.max(mxy, _tp.y + ry);
  }
  out.comps = [mnx, mxx, mny, mxy].map((v) => +v.toFixed(3));
  for (const tip of BW.tips) { _tp.copy(tip).applyMatrix4(bird.matrixWorld).project(camera); out.wings.push([+_tp.x.toFixed(3), +_tp.y.toFixed(3)]); }
  const tg = G.state === 'STAR_WAITING' || G.state === 'CLIMAX' ? starPos : (G.target ? G.target.pos : null);
  if (tg) { projectNDC(tg, _tp); out.target = [+_tp.x.toFixed(3), +_tp.y.toFixed(3)]; }
  if (G.state === 'STAR_WAITING' || G.state === 'CLIMAX') out.starExtent = +(G.starF * 1.0).toFixed(3);
  return out;
}
window.__d01 = {
  get state() { return G.state; }, get count() { return G.count; }, get stage() { return stageOf(Math.max(0, G.count - 1)) + 1; },
  get reached() { return G.reached; }, get done() { return G.done; }, get free() { return G.free; }, get quality() { return qName; },
  get climaxT() { return G.state === 'CLIMAX' ? G.st : -1; }, bounds: ndcBounds, hold: false
};

// ------------------------------------------------------------------ boot
const veilEl = document.getElementById('veil');
const waitEl = document.getElementById('wait');
setQuality(qName);
spawnTarget();
G.target.form = 1;
update(0.016);
let lastT = performance.now();
let first = true;
function frame(tNow) {
  requestAnimationFrame(frame);
  let rdt = (tNow - lastT) / 1000; lastT = tNow;
  if (!(rdt > 0)) rdt = 0.016;
  if (document.hidden) return;
  qmUpdate(rdt);
  const dt = window.__d01.hold ? 0 : Math.min(rdt, 0.1) * (AUTO ? 3 : 1);
  try {
    update(dt);
    if (Q.bloom > 0 && composer) composer.render(); else renderer.render(scene, camera);
    if (first) { first = false; window.__ready = true; waitEl.style.opacity = '0'; setTimeout(() => waitEl.remove(), 1400); }
  } catch (e) { ERR('frame: ' + (e && e.message)); }
}
requestAnimationFrame(frame);

} catch (e) { ERR('init: ' + (e && e.stack || e)); }
