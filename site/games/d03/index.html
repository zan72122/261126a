}

// ---------------------------------------------------------------- state machine
const _op = new V3();
function updateGame(dt, t) {
  G.st += dt;

    orb.alpha += (orb.alphaT - orb.alpha) * damp(dt, orb.alphaT > orb.alpha ? 0.35 : 0.15);
    if (orb.alphaT === 0 && orb.alpha < 0.02) orb.g.visible = false;
  }
  switch (G.state) {
    case 'TITLE_IDLE': titleOrbPos(orb.base); break;
    case 'TRAVEL': {
      const finalLeg = G.call >= 18;
      if (finalLeg) {
        G.stopS = SEND; G.palTT = Math.max(G.palTT, 2.6 + 0.2 * smooth(SEND - 40, SEND, G.sg));

      } else {

      }

    }
    case 'TARGET_READY': {

      if (G.idleT > 5.5 && Math.floor((G.idleT - 5.5) / 3) !== Math.floor((G.idleT - 5.5 - dt) / 3)) { const u = CALLS[G.call].unit; const x = u.cx ?? u.pos.x, z = u.cz ?? u.pos.z; wave(x, z, 3, 2.2, 0.45); }

      if (last && (last.done || last.t > 5.5) && G.st > 2.2) {
        if (G.call % 6 === 0 && G.call < 18) { G.stage++; G.palTT = G.stage; setState('STAGE_TRANSITION'); pathAt(G.sg); wave(giraffe.pos.x, giraffe.pos.z, 14, 5, 1.0); pollenRise(giraffe.pos.x, giraffe.pos.z, 50, 12, true); SKY.uPulse.value = 1.2; }
        else setState('TRAVEL');
      }
      break;
    }
    case 'STAGE_TRANSITION': {

    }

        showOrb(new V3(giraffe.pos.x - PP.tx * 0.2, H(giraffe.pos.x, giraffe.pos.z) + 4.0, giraffe.pos.z - PP.tz * 0.2), 'again');
      }
      if (G.afterOrb && G.orbKind === 'again') {
        pathAt(SEND); orb.base.set(giraffe.pos.x - PP.tx * 0.2, H(giraffe.pos.x, giraffe.pos.z) + 4.0 + Math.sin(t * 1.2) * 0.1, giraffe.pos.z - PP.tz * 0.2);
        if (AUTOTEST && G.st > 8 && orb.alpha > 0.85 && camSettled()) { const s = screenOf(orb.base); handleTap(s.x, s.y); }

    }
  }

    const tv = Math.tan(camera.fov * Math.PI / 360), th = tv * camera.aspect;

    const R = Math.max(0, allow * G.ringR);
    ringGroup.position.copy(c); ringGroup.quaternion.copy(camera.quaternion); ringGroup.scale.setScalar(Math.max(0.001, R));

  }

    const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 1.5);
    const idle = G.state === 'TARGET_READY' ? G.idleT : 0;
    orb.boost += ((idle > 2.5 ? 1 : 0) - orb.boost) * damp(dt, 0.8);
    orb.bob += ((idle > 5.5 ? 1 : 0) - orb.bob) * damp(dt, 1.0);
    orb.g.position.copy(orb.base); orb.g.position.y += Math.sin(t * 1.6) * 0.28 * orb.bob;
    const a = orb.alpha;
    orb.core.material.opacity = a; orb.halo.material.opacity = a * (0.55 + 0.35 * pulse + 0.25 * orb.boost); orb.outer.material.opacity = a * (0.28 + 0.2 * pulse + 0.25 * orb.boost);
    const sc = (0.9 + 0.12 * pulse) * (1 + 0.25 * orb.boost); orb.halo.scale.setScalar(1.5 * sc); orb.outer.scale.setScalar(3.4 * sc); orb.core.scale.setScalar(1 + 0.1 * pulse);
    if (a > 0.5 && Math.random() < dt * (3 + orb.boost * 4)) { const th = Math.random() * 6.28; spawn(GLOW, { x: orb.g.position.x + Math.cos(th) * 0.5, y: orb.g.position.y + (Math.random() - 0.5) * 0.4, z: orb.g.position.z + Math.sin(th) * 0.5, vx: -Math.sin(th) * 0.4, vy: 0.3, vz: Math.cos(th) * 0.4, life: 1.2, size: 0.07, drag: 0.6 }); }

  if (G.reset > 0) {

    const u = G.reset; el.style.opacity = String(u < 1.3 ? smooth(0, 1.3, u) : 1 - smooth(1.6, 3.0, u));
    if (u >= 1.3 && !G.didReset) { G.didReset = true; G.loops++; resetWorld(); camInit = false; }
    if (u > 3.0) { G.reset = 0; G.didReset = false; el.style.opacity = '0'; }

}
function climax(dt, t) {
  G.climaxT += dt; const c = G.climaxT;
  if (c < dt * 1.5) { SFX.climaxSwell(); if (AU.pad) AU.pad.f.frequency.setTargetAtTime(1300, AU.ctx.currentTime, 3); }
  G.palTT = 3;
  if (!G.afterOrb) SKY.uRingDir.value.copy(G.ringDir);
  // 3-6s: pollen streams to the sky centre
  if (c > 3 && c < 6.3) {
    const rate = 70 * dt;
    for (let k = 0; k < rate; k++) {
      const src = G.joined[Math.floor(Math.random() * G.joined.length)] || null;
      let x = giraffe.pos.x, z = giraffe.pos.z;
      if (src && src.kind !== 'birds') { x = src.unit.pos.x; z = src.unit.pos.z; }
      const y = H(x, z) + 0.3, rc = G.ringC;
      spawn(GLOW, { x, y, z, bez: [[x, y, z], [lerp(x, rc.x, 0.25) + (Math.random() - 0.5) * 20, y + 25 + Math.random() * 20, lerp(z, rc.z, 0.25) + (Math.random() - 0.5) * 20], [rc.x + (Math.random() - 0.5) * 6, rc.y + (Math.random() - 0.5) * 6, rc.z]], life: 2.4 + Math.random() * 1.2, size: 0.16, a: 0.9 });
    }
    SKY.uRingGlow.value = smooth(3.5, 6.2, c) * 0.8;
    G.bloomT = lerp(0.3, 0.5, smooth(3, 6, c));
  }
  if (c > 6 && !G.ringOpened) {
    G.ringOpened = true; ringGroup.visible = true; G.ringR = 0; SFX.climax();
    for (let i = 0; i < 5; i++) { const a = (i / 5 - 0.5) * 1.2; beam(G.ringC.x + Math.sin(a) * 50, G.ringC.y - 10, G.ringC.z, -Math.sin(a) * 0.3, -1, 0.35, 140, 9, 9, 0.2); }
  }
  if (c > 6) {
    const e = smooth(6, 10, c);

    SKY.uRays.value = smooth(6.5, 9.5, c) * (1 - 0.4 * smooth(14, 24, c));
    SKY.uRingGlow.value = 0.8 * (1 - smooth(6, 9, c)) + 0.25;
    SH.uGold.value = smooth(6.8, 9.5, c) * (1 - 0.55 * smooth(13, 24, c));
    SKY.uGoldSky.value = smooth(6.5, 9.5, c) * 0.5 * (1 - 0.5 * smooth(14, 24, c));
    G.bloomT = lerp(0.3, 0.8, smooth(6, 8, c) * (1 - 0.55 * smooth(12, 22, c)));
    pathAt(SEND);
    TU.uSweep.value.set(giraffe.pos.x, giraffe.pos.z, smooth(6.5, 12, c) * 160, (1 - smooth(14, 24, c)) * 0.9 * smooth(6.5, 7, c));
    if (c > 9 && Math.random() < dt * 30) {
      const cp = camera.position; spawn(GLOW, { x: cp.x + PP.tx * 28 + (Math.random() - 0.5) * 50, y: cp.y + 12 + Math.random() * 8, z: cp.z + PP.tz * 28 + (Math.random() - 0.5) * 50, vx: 0, vy: -0.9, vz: 0, life: 6, size: 0.14, drag: 0.1, a: 0.8 });
    }
  }
  if (AU.ok && c > 12 && c < 12 + dt * 1.5) AU.pad.g.gain.setTargetAtTime(0.03, AU.ctx.currentTime, 4);
  if (G.state === 'CLIMAX' && c > 24) setState('AFTERGLOW');
}

// ---------------------------------------------------------------- quality
const Q = { level: QFIX || 'mid', fixed: !!QFIX, fps: 60, low: 0, high: 0, cool: 6, skip: 3 };
let composer = null, bloomPass = null;
function applyQuality(lv) {
  Q.level = lv; const p = PRESET[lv];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, p.pr));
  const shadows = p.shadow > 0;
  renderer.shadowMap.enabled = shadows; sun.castShadow = shadows;
  if (shadows && sun.shadow.mapSize.x !== p.shadow) { sun.shadow.mapSize.set(p.shadow, p.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }

  grass.count = Math.min(grass.userData.max, p.grass);
  GLOW.cap = p.parts; DUST.cap = Math.min(DUST.N, Math.round(p.parts * 0.3) + 40);
  waterMats.forEach(m => { m.uniforms.uDetail.value = p.water; });
  if (p.bloom > 0) {
    if (!composer) {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.28, 0.5, 0.9);
      composer.addPass(bloomPass); composer.addPass(new OutputPass());
    }

}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 55 : 50; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); if (bloomPass) { const k = PRESET[Q.level].bloom || 0.5; bloomPass.setSize(Math.round(w * renderer.getPixelRatio() * k), Math.round(h * renderer.getPixelRatio() * k)); } }
  const px = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  GLOW.mat.uniforms.uPx.value = px; DUST.mat.uniforms.uPx.value = px;

}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('visibilitychange', () => {
  Q.skip = 2;
  if (AU.ctx) { if (document.hidden) AU.ctx.suspend().catch(() => {}); else AU.ctx.resume().catch(() => {}); }
});
function qualityTick(rawDt) {
  if (Q.fixed) return;
  if (Q.skip > 0) { Q.skip -= rawDt; return; }
  if (rawDt <= 0 || rawDt > 0.5) return;
  Q.fps += (1 / rawDt - Q.fps) * 0.06;
  Q.cool -= rawDt;
  Q.low = Q.fps < 50 ? Q.low + rawDt : 0;
  Q.high = Q.fps >= 58 ? Q.high + rawDt : 0;

  if (Q.low > 3 && i > 0) { applyQuality(LEVELS[i - 1]); Q.cool = 12; Q.low = 0; Q.high = 0; Q.fps = 55; }

// ---------------------------------------------------------------- main loop
let last = performance.now(), frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try {
    const raw = Math.max(0, (now - last) / 1000); last = now;
    const dt = Math.min(raw, AUTOTEST ? 0.25 : 0.1) * TS;
    G.t += dt; const t = G.t;
    TU.uTime.value = t; SKY.uTime.value = t; waterMats.forEach(m => { m.uniforms.uTime.value = t; });
    stepBudget = Math.min(6, stepBudget + raw * 9);

    updateGround(dt, t);
    updateBirds(dt, t);
    updateWaves(dt);
    updateParticles(GLOW, dt, t); updateParticles(DUST, dt, t);

    updateBeams(dt);
    updatePalette(dt);
    sky.position.copy(camera.position);
    if (AU.ok && AU.wind) { const k = 0.04 + 0.025 * Math.sin(t * 0.13) + 0.015 * Math.sin(t * 0.47); AU.wind.g.gain.setTargetAtTime(k, AU.ctx.currentTime, 0.5); AU.wind.f.frequency.setTargetAtTime(380 + 140 * Math.sin(t * 0.21), AU.ctx.currentTime, 0.8); }
    const useBloom = composer && PRESET[Q.level].bloom > 0;
    if (useBloom) { bloomPass.strength += (G.bloomT - bloomPass.strength) * damp(dt, 0.8); composer.render(); }
    else renderer.render(scene, camera);
    frames++;
    if (frames === 3) { window.__ready = true; Q.skip = 3; }
    qualityTick(raw);
  } catch (e) { reportError(e); }
}

// ---------------------------------------------------------------- probe (devtools only)
window.__game = {
  get state() { return G.state; }, get call() { return G.call; }, get stage() { return G.stage; }, get joined() { return G.joined.length; },
  get quality() { return Q.level; }, get climax() { return G.climaxReached; }, get log() { return G.log; },
  probe() {

  applyQuality(Q.level);
  resetWorld();
