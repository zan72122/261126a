const SKY_GLSL = /* glsl */`
uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uBandCol; uniform float uBand;
uniform vec3 uCloudLit; uniform vec3 uCloudDark; uniform float uTime; uniform float uStars; uniform float uBurst; uniform float uSunK;

float vn2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1.0,0.0)), f.x), mix(h21(i+vec2(0.0,1.0)), h21(i+vec2(1.0,1.0)), f.x), f.y); }

vec3 skyCol(vec3 d, float withSun){
  float h = d.y;
  float hp = max(h, 0.0);
  vec3 col = mix(uHor, uZen, smoothstep(0.0, 0.42, pow(hp, 0.7)));
  float sd = max(dot(d, uSunDir), 0.0);
  float band = exp(-abs(h - 0.012) / uBand);

  col += uSunCol * (pow(sd, 5.0)*0.4 + pow(sd, 40.0)*0.75 + pow(sd, 500.0)*1.4) * uSunK;
  if (h > -0.03) {
    vec2 uv = d.xz / (hp + 0.085);
    float n = fbm2(uv*vec2(0.5, 1.8) + vec2(uTime*0.004, 0.0));
    float streak = smoothstep(0.55, 0.8, n) * smoothstep(0.004, 0.05, h) * (1.0 - smoothstep(0.22, 0.55, h));

    cl *= 1.0 - 0.9*pow(sd, 30.0);
    float lit = 0.3 + 0.7*pow(sd, 3.0);
    vec3 cc = mix(uCloudDark, uCloudLit, lit) + uSunCol*pow(sd, 14.0)*0.5;
    col = mix(col, cc, cl);
  }
  if (uStars > 0.001 && h > 0.1) {
    vec2 sp = floor(vec2(atan(d.x, d.z), asin(clamp(h,0.0,1.0))) * 420.0);
    float s = step(0.9982, h21(sp)) * (0.6 + 0.4*sin(uTime*2.0 + h21(sp + 3.0)*40.0));

const WAVE_GLSL = /* glsl */`
vec3 waves(vec2 p, float t){
  const vec2 WD[4] = vec2[4](vec2(0.196,-0.981), vec2(-0.707,-0.707), vec2(0.949,-0.316), vec2(-0.243,0.970));
  const float WL[4] = float[4](11.0, 6.5, 3.8, 2.3);
  const float WA[4] = float[4](0.10, 0.065, 0.035, 0.018);
  float h = 0.0; vec2 g = vec2(0.0);
  for (int i=0;i<4;i++){ float k = 6.2831853/WL[i]; float c = sqrt(9.8/k); float ph = k*(dot(WD[i],p) - c*t);
    h += WA[i]*sin(ph); g += WA[i]*k*cos(ph)*WD[i]; }
  return vec3(h, g);
}
vec2 wavesDetail(vec2 p, float t){
  const vec2 WD[4] = vec2[4](vec2(0.6,-0.8), vec2(-0.9,-0.43), vec2(0.17,0.98), vec2(-0.5,0.866));
  const float WL[4] = float[4](1.3, 0.83, 0.52, 0.34);
  const float WA[4] = float[4](0.012, 0.0075, 0.0045, 0.0026);
  vec2 g = vec2(0.0);
  for (int i=0;i<4;i++){ float k = 6.2831853/WL[i]; float c = sqrt(9.8/k); float ph = k*(dot(WD[i],p) - c*t);

  return g;
}

  vec2 g = vec2(0.0); ring = 0.0;
  for (int i=0;i<8;i++){ vec4 r = uRip[i]; float age = t - r.z;
    if (age < 0.0 || age > 4.5 || r.w <= 0.0) continue;
    vec2 dv = p - r.xy; float d = length(dv) + 1e-4; float rad = 0.35 + age*2.3; float x = d - rad;
    float env = exp(-x*x*5.0) * exp(-age*1.0) * r.w;
    g += (dv/d) * cos(x*9.0) * env * 0.4; ring += env; }
  return g;
}`;

const CAUSTIC_GLSL = /* glsl */`
float causticAt(vec2 p, float t){
  vec2 q = p*0.3;
  vec2 a = q + vec2(sin(q.y*1.3 + t*0.6), cos(q.x*1.1 - t*0.5))*0.6;
  vec2 b = q*1.6 + vec2(cos(q.y*0.9 - t*0.7), sin(q.x*1.4 + t*0.45))*0.5;
  float c1 = abs(sin(a.x*2.1 + t*0.4) + sin(a.y*2.3 - t*0.3) + sin((a.x + a.y)*1.7 + t*0.5));
  float c2 = abs(sin(b.x*2.0 - t*0.35) + sin(b.y*2.2 + t*0.42) + sin((b.x - b.y)*1.9 - t*0.3));
  return pow(max(0.0, 1.0 - c1*0.55), 4.0) + pow(max(0.0, 1.0 - c2*0.55), 4.0)*0.7;
}`;

function addCaustics(mat, strength = 1) {
  mat.userData.cs = { value: strength };
  mat.onBeforeCompile = function (sh) {
    sh.uniforms.uTime = CU.uTime; sh.uniforms.uCaus = CU.uCaus; sh.uniforms.uReefSweep = CU.uReefSweep;
    sh.uniforms.uReefGold = CU.uReefGold; sh.uniforms.uCS = this.userData.cs;
    sh.vertexShader = 'varying vec3 vCW;\nvarying vec3 vCN;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 cwp = vec4(transformed, 1.0); vec3 cnn = objectNormal;
      #ifdef USE_INSTANCING
        cwp = instanceMatrix * cwp; cnn = mat3(instanceMatrix) * cnn;
      #endif
      vCW = (modelMatrix * cwp).xyz; vCN = normalize(mat3(modelMatrix) * cnn);`);
    sh.fragmentShader = 'uniform float uTime;\nuniform vec3 uCaus;\nuniform float uReefSweep;\nuniform vec3 uReefGold;\nuniform float uCS;\nvarying vec3 vCW;\nvarying vec3 vCN;\n' + CAUSTIC_GLSL + '\n' +
      sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float czz = causticAt(vCW.xz, uTime);
      float upk = clamp(vCN.y*0.75 + 0.25, 0.0, 1.0);
      float dfk = clamp(1.0 + vCW.y*0.035, 0.45, 1.0);
      totalEmissiveRadiance += diffuseColor.rgb * uCaus * czz * upk * dfk * uCS;
      totalEmissiveRadiance += diffuseColor.rgb * uReefGold * uReefSweep * (0.3 + 0.7*upk) * 0.22;`);
  };
  mat.customProgramCacheKey = () => 'caus';
  return mat;
}

function makeSandTexture() {
  const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N;
    const warp = Math.sin(v * Math.PI * 2 * 3 + Math.sin(u * Math.PI * 2 * 2) * 1.2) * 0.06;
    const rip = 0.5 + 0.5 * Math.sin((u + warp) * Math.PI * 2 * 9);
    const g = h3(x, y, 7);
    const val = 0.78 + rip * 0.14 + (g - 0.5) * 0.12;
    const i = (y * N + x) * 4;
    img.data[i] = clamp(val * 248, 0, 255); img.data[i + 1] = clamp(val * 240, 0, 255); img.data[i + 2] = clamp(val * 222, 0, 255); img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

  ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
  const r = mulberry(77);

    const x2 = x + Math.cos(a) * len, y2 = y - Math.sin(a) * len;
    ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
    if (d < 6) { br(x2, y2, a + 0.25 + r() * 0.2, len * 0.78, w * 0.75, d + 1); br(x2, y2, a - 0.25 - r() * 0.2, len * 0.78, w * 0.75, d + 1); }
  }
  for (let i = 0; i < 5; i++) br(N / 2, N, Math.PI * (0.2 + i * 0.15), 40, 5, 0);
  ctx.lineWidth = 1.2; ctx.globalAlpha = 0.8;
  for (let k = 0; k < 14; k++) { ctx.beginPath(); ctx.arc(N / 2, N, 20 + k * 16, Math.PI, 0); ctx.stroke(); }
  const t = new THREE.CanvasTexture(cv); return t;
}

// =====================================================================
// Sea surface (above) and its underside (below)

const seaMat = new THREE.ShaderMaterial({
  uniforms: U, fog: false,
  vertexShader: WAVE_GLSL + `uniform float uTime; varying vec3 vW;
    void main(){ vec4 w = modelMatrix*vec4(position,1.0); w.y += waves(w.xz, uTime).x; vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: SKY_GLSL + WAVE_GLSL + `uniform vec3 uSea; uniform vec3 uAirFog; uniform float uAirN; uniform float uAirF; uniform float uSeaSweep; uniform vec3 uGold;
    varying vec3 vW;
    void main(){
      float dist = length(vW.xz - cameraPosition.xz);
      vec3 wv = waves(vW.xz, uTime);
      float ring;
      vec2 g = wv.yz + wavesDetail(vW.xz, uTime)*exp(-dist/70.0) + ripples(vW.xz, uTime, ring);
      vec3 n = normalize(vec3(-g.x, 1.0, -g.y));

  if (composer && Q.bloom) composer.render();
  else renderSplit(null);
}

// =====================================================================
// Automatic quality control
// =====================================================================
const perf = { frames: [], cooldown: 0, warm: 4 };
function autoQuality(rdt, now) {
  if (QFIX) return;
  perf.frames.push([now, rdt]);
  while (perf.frames.length && now - perf.frames[0][0] > 10.5) perf.frames.shift();
  perf.cooldown -= rdt; perf.warm -= rdt;
  if (perf.warm > 0 || perf.cooldown > 0) return;
  const last = (sec) => { let n = 0, s = 0; for (let i = perf.frames.length - 1; i >= 0 && now - perf.frames[i][0] <= sec; i--) { n++; s += perf.frames[i][1]; } return n > 3 ? n / s : 60; };
  const busy = S.state === 'ACCELERATING' || S.state === 'LEAPING' || S.state === 'FINALE';
  const f3 = last(3), f10 = last(10);
  const li = LEVELS.indexOf(qLevel);
  if (f3 < 48 && li > 0 && (!busy || f3 < 30)) { applyQuality(LEVELS[li - 1]); perf.cooldown = 10; perf.frames.length = 0; }
  else if (!busy && perf.frames.length && now - perf.frames[0][0] > 9.8 && f10 >= 57 && li < 2) { applyQuality(LEVELS[li + 1]); perf.cooldown = 10; perf.frames.length = 0; }
}

// =====================================================================
// Input
// =====================================================================
let activePointer = null;
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  if (!e.isPrimary) return;
  activePointer = e.pointerId;
  handleTap(e.clientX, e.clientY);
}, { passive: false });
const release = (e) => { audioInit(); if (e.pointerId === activePointer) activePointer = null; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) {
  document.addEventListener(ev, (e) => { if (ev === 'touchend') audioInit(); if (e.cancelable) e.preventDefault(); }, { passive: false });
}

// =====================================================================
// Autotest
// =====================================================================
const AT = { lastTapCount: -1 };
function autotestStep() {
  const st = S.state;
  if ((st === 'READY' || st === 'TOUCH_WINDOW' || st === 'FREE_PLAY') && S.tState > 0.4) {
    const p = toScreen(_mv.set(D.x, D.y, D.z));
    handleTap(p.x, p.y);
  } else if (st === 'SWIMMING' && S.mode === 'main' && S.count % 3 === 1 && !S.reserved && S.tState > 0.8 && S.beamK > 0.5) {
    const p = toScreen(_mv.set(0, -2.0, S.beamZ));
    handleTap(p.x, p.y);
  }
}
window.__d04 = {
  get state() { return S.state; }, get count() { return S.count; }, get mode() { return S.mode; }, get quality() { return qLevel; },
  get sunAlt() { return S.sunAlt; }, get p() { return S.p; },
  probe() {
    const d = toScreen(_mv.set(D.x, D.y, D.z));
    const n = toScreen(noseWorld(new THREE.Vector3())), tl = toScreen(tailWorld(new THREE.Vector3()));
    const b = toScreen(_mv.set(0, -1.5, S.beamZ));
    const sd = U.uSunDir.value; const s = toScreen(_mv.set(topCam.position.x + sd.x * 300, topCam.position.y + sd.y * 300, topCam.position.z + sd.z * 300));
    const r = (o) => [Math.round(o.x), Math.round(o.y)];
    return { W: view.w, H: view.h, dolphin: r(d), nose: r(n), tail: r(tl), beam: r(b), sun: r(s), dy: +D.y.toFixed(2) };
  },
};

// =====================================================================
// Main loop
// =====================================================================
let last = performance.now(), paused = false, frameCount = 0, simTime = 0;
document.addEventListener('visibilitychange', () => {
  paused = document.hidden; last = performance.now(); perf.frames.length = 0; perf.warm = Math.max(perf.warm, 1.5);
  if (AU.ctx) { try { if (paused) AU.ctx.suspend(); else AU.ctx.resume(); } catch (e) { } }
});
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { last = now; return; }
  const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const dt = rdt * TIME_SCALE;
  simTime += dt;
  U.uTime.value = simTime;
  try {
    updateGame(dt);
    updatePalette();
    updateCameras();
    updateTiles();
    updateFish(dt, simTime);
    updateRays();
    updateDrops(dt * S.slow);
    S.envTimer -= dt;
    if (S.envDirty && S.envTimer <= 0 && (S.sunT >= 1 || S.pT >= 1)) { if (S.sunT >= 1 && S.pT >= 1) { refreshEnv(); S.envDirty = false; S.envTimer = 1; } }
    renderFrame();
    autoQuality(rdt, now / 1000);
  } catch (e) {
    if (window.__errors.length < 20) window.__errors.push('frame: ' + (e && e.message || e));
    console.error(e);
  }
  frameCount++;
  if (frameCount === 3) window.__ready = true;
}

// =====================================================================
// Start
// =====================================================================
function init() {
  applyQuality(qLevel);
  if (SKIP) {
    S.count = SKIP; S.p = S.pTo = Math.min(3, SKIP / 8); S.sunAlt = S.sunTo = sunAltFor(SKIP);
  }
  S.beamZ = 0; D.z = 0.3; S.beamK = 0.2; S.planH = S.count === TOTAL - 1 ? 3 : STAGE_H[stageIdx()];
  S.beamWide = S.count === TOTAL - 1 ? 1.5 : 1; S.beamGold = S.count === TOTAL - 1 ? 1 : 0;
  CAM.dist = camDistTarget(S.planH); CAM.lagZ = D.z; CAM.z = D.z + CAM.dist;
  updatePalette(); updateCameras();
  refreshEnv(); S.envDirty = false;
  requestAnimationFrame((t) => { last = t; frame(t); });
}
init();
