<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>熱気球と花の谷の郵便</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #dce9f2;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 42%, #f4ecdc 0%, #cfe6f4 100%);
      opacity: 1; transition: opacity 1.1s ease-out;
    }
    #fps {
      position: fixed; top: 8px; left: 8px; display: none;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(24, 34, 48, 0.56); color: #f4ecdc;
      font: 11px/1.4 ui-monospace, Menlo, monospace; pointer-events: none;
      white-space: pre;
    }
    #action-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid rgba(244, 236, 220, 0.78);
      background: radial-gradient(circle at 35% 30%, rgba(244, 236, 220, 0.42), rgba(74, 168, 166, 0.36));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(48, 56, 72, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.28s ease, transform 0.28s ease;
      cursor: pointer;
    }
    #action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #action-btn:active {
      transform: scale(0.92);
    }
    #action-btn svg {
      width: 42px;
      height: 42px;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="action-btn" type="button" aria-label="action">
    <!-- Wordless dandelion seed tuft icon (dismount / slow float) -->
    <svg id="icon-dandelion" viewBox="0 0 64 64" fill="none">
      <path d="M16 26 C22 14, 42 14, 48 26" stroke="#f4ecdc" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M21 25 C25 18, 39 18, 43 25" stroke="#f2ba86" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 16 L32 45" stroke="#f4ecdc" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22 25 L32 22 L42 25" stroke="#f4ecdc" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="32" cy="48" rx="3.2" ry="5" fill="#f2ba86"/>
      <circle cx="20" cy="20" r="1.5" fill="#f4ecdc"/>
      <circle cx="44" cy="20" r="1.5" fill="#f4ecdc"/>
      <circle cx="32" cy="12" r="1.6" fill="#f2ba86"/>
    </svg>
    <!-- Wordless hot air balloon icon (call balloon when on foot) -->
    <svg id="icon-balloon" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M32 10 C20 10, 15 21, 18 31 C20 38, 26 42, 28 45 L36 45 C38 42, 44 38, 46 31 C49 21, 44 10, 32 10 Z" fill="#f4ecdc" fill-opacity="0.92" stroke="#4aa8a6" stroke-width="2"/>
      <path d="M18 26 C24 28, 40 28, 46 26" stroke="#e89e6c" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="27" y="49" width="10" height="7" rx="1.8" fill="#d2b48c" stroke="#f4ecdc" stroke-width="1.4"/>
      <path d="M28 45 L28 49 M36 45 L36 49" stroke="#f4ecdc" stroke-width="1.4"/>
    </svg>
  </button>
  <div id="veil"></div>
  <div id="fps"></div>
  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'garden';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
