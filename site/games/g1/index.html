<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>雲の駅と小さな蒸気機関車</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe2f2;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #c {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #edf4fa 0%, #bfd6ea 100%);
      opacity: 1;
      transition: opacity 1.3s ease-out;
    }
    #fps {
      position: fixed;
      top: 8px;
      left: 8px;
      display: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(18, 28, 40, 0.58);
      color: #f0f5fa;
      font: 11px/1.4 ui-monospace, Menlo, monospace;
      pointer-events: none;
      white-space: pre;
    }
    .hud-btn {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(250, 245, 232, 0.72);
      background: radial-gradient(circle at 35% 30%, rgba(250, 248, 242, 0.34), rgba(32, 52, 76, 0.48));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: pointer;
    }
    .hud-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .hud-btn:active {
      transform: scale(0.92);
    }
    .hud-btn svg {
      width: 38px;
      height: 38px;
      display: block;
    }
    #action-btn {
      right: max(18px, env(safe-area-inset-right));
    }
    #whistle-btn {
      left: max(18px, env(safe-area-inset-left));
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Wordless whistle & steam play button -->
  <button id="whistle-btn" class="hud-btn" type="button" aria-label="whistle">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M24 44 L24 28 C24 24, 40 24, 40 28 L40 44 Z" fill="#e5b33e"/>
      <rect x="21" y="44" width="22" height="5" rx="2" fill="#f7f4eb"/>
      <path d="M32 22 C26 16, 20 14, 15 16" stroke="#f7f4eb" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M35 19 C38 13, 44 10, 50 12" stroke="#f7f4eb" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="48" cy="18" r="3" fill="#f7f4eb" fill-opacity="0.85"/>
    </svg>
  </button>

  <!-- Wordless umbrella dismount / call locomotive button -->
  <button id="action-btn" class="hud-btn" type="button" aria-label="action">
    <svg id="icon-umbrella" viewBox="0 0 64 64" fill="none">
      <path d="M12 29 C16 14, 48 14, 52 29 C44 26, 20 26, 12 29 Z" fill="#2d67b8" stroke="#e5b33e" stroke-width="2.4"/>
      <path d="M32 27 L32 45 C32 48, 36 48, 36 45" stroke="#f7f4eb" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <svg id="icon-train" viewBox="0 0 64 64" fill="none" style="display:none">
      <rect x="14" y="28" width="32" height="14" rx="3" fill="#2d5a42" stroke="#e5b33e" stroke-width="2"/>
      <rect x="34" y="18" width="12" height="10" rx="1.5" fill="#275da8" stroke="#f7f4eb" stroke-width="1.6"/>
      <rect x="17" y="19" width="6" height="9" rx="1" fill="#2b333a"/>
      <circle cx="22" cy="45" r="4.5" fill="#e5b33e"/>
      <circle cx="38" cy="45" r="4.5" fill="#e5b33e"/>
    </svg>
  </button>

  <div id="veil"></div>
  <div id="fps"></div>

  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'home';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
