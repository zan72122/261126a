<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>帆船と星明かりの島めぐり</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #14223d;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #2b3252 0%, #101b33 100%);
      opacity: 1; transition: opacity 1.4s ease-out;
    }
    #fps {
      position: fixed; top: 8px; left: 8px; display: none;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(12, 20, 40, 0.62); color: #efeae0;
      font: 11px/1.4 ui-monospace, Menlo, monospace; pointer-events: none;
      white-space: pre;
    }
    #action-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(239, 234, 224, 0.58);
      background: radial-gradient(circle at 35% 30%, rgba(230, 157, 56, 0.28), rgba(20, 42, 79, 0.56));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.26s ease, transform 0.26s ease;
      cursor: pointer;
    }
    #action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #action-btn:active { transform: scale(0.93); }
    #action-btn svg { width: 38px; height: 38px; display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="action-btn" type="button" aria-label="action">
    <!-- Wordless shell + floating light icon (dismount / slow descent or step ashore) -->
    <svg id="icon-float" viewBox="0 0 64 64" fill="none">
      <path d="M14 27 C20 13, 44 13, 50 27 C42 24, 22 24, 14 27 Z" fill="#efeae0" fill-opacity="0.92"/>
      <path d="M22 26 L32 39 L42 26" stroke="#e69d38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="43" r="4.2" fill="#efeae0"/>
      <path d="M26 54 C28 48, 36 48, 38 54" stroke="#d96b57" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <!-- Wordless lateen sailboat icon (board / return to boat) -->
    <svg id="icon-sail" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M31 12 L48 39 L20 39 Z" fill="#efeae0" fill-opacity="0.94"/>
      <path d="M14 43 L50 43 L44 51 L20 51 Z" fill="#efeae0"/>
      <path d="M16 46 L48 46" stroke="#b86142" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <!-- Wordless shell map icon (pick up shell map in harbor) -->
    <svg id="icon-shell" viewBox="0 0 64 64" fill="none" style="display:none">
      <path d="M14 38 C14 22, 24 14, 32 14 C40 14, 50 22, 50 38 C43 44, 21 44, 14 38 Z" fill="#efeae0" fill-opacity="0.94"/>
      <path d="M32 15 L32 42 M23 18 L28 42 M41 18 L36 42" stroke="#d96b57" stroke-width="2" stroke-linecap="round"/>
      <path d="M25 46 L39 46 L36 51 L28 51 Z" fill="#e69d38"/>
    </svg>
  </button>
  <div id="veil"></div>
  <div id="fps"></div>
  <script>
    window.__ready = false;
    window.__errors = [];
    window.__moment = 'harbor';
    window.__autolog = [];
    window.__autodone = false;
    window.addEventListener('error', function (e) {
      var msg = (e && (e.message || (e.error && e.error.stack))) || String(e);
      window.__errors.push(msg);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      window.__errors.push(r ? (r.stack || r.message || String(r)) : 'unhandledrejection');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
